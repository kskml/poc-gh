.pbv-modeh__pulse { justify-self: end; display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 999px;
  background: color-mix(in srgb, var(--lever-color) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 50%, transparent); }
.pbv-modeh__pulse-num { font: 900 1rem/1 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 95%, #fff); }
.pbv-modeh__pulse-label { font: 700 .68rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); }
@media (max-width: 720px) {
  .pbv-modeh__row { grid-template-columns: 1fr; gap: 8px; }
  .pbv-modeh__stats { flex-direction: row; gap: 10px; align-items: center; }
}

/* =========================================================================
   LEVER 6 · Custom agent · invocation flow (tile + hero)
   Animated agent-flow diagram (USER → CUSTOM AGENT → PROMPT, then HARNESS
   retrieves the agent file and fans out to: adjust tools, inject definition,
   append prompt). Replaces the static image11.png.
   ========================================================================= */

/* color helpers — tuned to the diagram palette (orange/amber/purple/green) */
.pbv--custom-agent-tile,
.pbv--custom-agent-hero {
  --ca-agent:   var(--lever-color);          /* amber/orange */
  --ca-prompt:  #a855f7;                     /* purple */
  --ca-harness: color-mix(in srgb, var(--lever-color) 75%, #fff);
  --ca-tools:   #34d399;                     /* green */
  --ca-append:  #a855f7;
  --ca-def:     var(--lever-color);
}

/* --------- TILE (compact, fits the card) --------- */
.pbv--custom-agent-tile {
  position: absolute; inset: 0;
  display: grid; grid-template-rows: auto auto auto 1fr;
  gap: 8px; padding: 12px 14px 14px;
  align-content: start;
}
.pbv-ca__cmd {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--ca-prompt) 14%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--ca-prompt) 38%, var(--border));
  font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  color: var(--text);
  width: max-content; max-width: 100%;
  opacity: 0; animation: pbvCaCmdIn 4.8s var(--ease) infinite;
}
.pbv-ca__cmd-prompt { color: color-mix(in srgb, var(--ca-prompt) 90%, #fff); }
.pbv-ca__cmd-text   { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbv-ca__caret {
  display: inline-block; width: 6px; height: 11px; margin-left: 2px;
  background: color-mix(in srgb, var(--ca-prompt) 80%, #fff);
  animation: pbvCaCaret 1s steps(2, end) infinite;
}
.pbv-ca__row {
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 8px;
}
.pbv-ca__node {
  padding: 8px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border: 1px solid color-mix(in srgb, var(--ca-agent) 35%, var(--border));
  font: 700 .7rem/1.1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--text);
  text-align: center;
  opacity: 0; animation: pbvCaNodeIn 4.8s var(--ease) infinite;
}
.pbv-ca__node--agent   { border-color: color-mix(in srgb, var(--ca-agent) 55%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, var(--ca-agent) 18%, var(--surface)), var(--surface) 75%); }
.pbv-ca__node--prompt  { border-color: color-mix(in srgb, var(--ca-prompt) 55%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, var(--ca-prompt) 16%, var(--surface)), var(--surface) 75%); }
.pbv-ca__node--harness { border-color: color-mix(in srgb, var(--ca-harness) 55%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, var(--ca-harness) 16%, var(--surface)), var(--surface) 80%);
  justify-self: center; }
.pbv-ca__node--tools   { border-color: color-mix(in srgb, var(--ca-tools) 55%, var(--border));
  background: color-mix(in srgb, var(--ca-tools) 14%, var(--surface)); }
.pbv-ca__node--def     { border-color: color-mix(in srgb, var(--ca-def) 55%, var(--border));
  background: color-mix(in srgb, var(--ca-def) 16%, var(--surface)); }
.pbv-ca__node--append  { border-color: color-mix(in srgb, var(--ca-append) 55%, var(--border));
  background: color-mix(in srgb, var(--ca-append) 14%, var(--surface)); }

/* per-node sequenced delays (single shared 4.8s cycle) */
.pbv-ca__cmd                            { animation-delay: 0ms; }
.pbv-ca__row--top .pbv-ca__node--agent  { animation-delay: 350ms; }
.pbv-ca__row--top .pbv-ca__node--prompt { animation-delay: 700ms; }
.pbv-ca__trunk    .pbv-ca__node--harness{ animation-delay: 1050ms; }
.pbv-ca__fan-pills .pbv-ca__node--tools { animation-delay: 1400ms; }
.pbv-ca__fan-pills .pbv-ca__node--def   { animation-delay: 1550ms; }
.pbv-ca__fan-pills .pbv-ca__node--append{ animation-delay: 1700ms; }

/* arrows / connectors */
.pbv-ca__arrow {
  display: block;
  background: color-mix(in srgb, var(--ca-agent) 60%, transparent);
  opacity: 0; animation: pbvCaArrowIn 4.8s var(--ease) infinite;
}
.pbv-ca__arrow--h1 { height: 2px; width: 100%; animation-delay: 250ms; }
.pbv-ca__arrow--h2 { height: 2px; width: 100%; animation-delay: 600ms;
  background: color-mix(in srgb, var(--ca-prompt) 60%, transparent); }
.pbv-ca__arrow--v {
  width: 2px; height: 18px; margin: 0 auto;
  background: color-mix(in srgb, var(--ca-agent) 60%, transparent);
  animation-delay: 950ms;
}
.pbv-ca__trunk { display: grid; gap: 4px; justify-items: center; }

.pbv-ca__fan { display: grid; gap: 4px; }
.pbv-ca__fan-line {
  position: relative; height: 12px;
}
.pbv-ca__fan-stem {
  position: absolute; left: 50%; top: 0;
  width: 70%; height: 100%;
  transform: translateX(-50%);
  border-top: 2px solid color-mix(in srgb, var(--ca-harness) 55%, transparent);
  border-left: 2px solid color-mix(in srgb, var(--ca-harness) 55%, transparent);
  border-right: 2px solid color-mix(in srgb, var(--ca-harness) 55%, transparent);
  border-top-left-radius: 6px; border-top-right-radius: 6px;
  opacity: 0; animation: pbvCaArrowIn 4.8s var(--ease) infinite;
  animation-delay: 1250ms;
}
.pbv-ca__fan-pills {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
}

/* tile keyframes */
@keyframes pbvCaCmdIn {
  0%, 4%    { opacity: 0; transform: translateY(-4px); }
  10%, 90%  { opacity: 1; transform: translateY(0); }
  96%, 100% { opacity: 0; transform: translateY(-4px); }
}
@keyframes pbvCaNodeIn {
  0%, 6%    { opacity: 0; transform: translateY(6px) scale(.96); }
  18%, 88%  { opacity: 1; transform: translateY(0) scale(1); }
  96%, 100% { opacity: 0; transform: translateY(6px) scale(.96); }
}
@keyframes pbvCaArrowIn {
  0%, 8%    { opacity: 0; transform: scaleX(0); transform-origin: left; }
  20%, 85%  { opacity: 1; transform: scaleX(1); }
  95%, 100% { opacity: 0; transform: scaleX(0); }
}
@keyframes pbvCaCaret {
  50% { opacity: 0; }
}

/* --------- HERO (full panel) --------- */
.pbv--custom-agent-hero {
  position: relative;
  display: grid; grid-template-rows: auto auto auto auto;
  gap: 14px;
  min-height: 360px;
  padding: 4px 2px 8px;
}
.pbv-cah__title { display: flex; flex-direction: column; gap: 4px; }
.pbv-cah__title-eyebrow {
  font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff);
}
.pbv-cah__title-headline { font-size: 1.08rem; font-weight: 700; color: var(--text); }

/* Row 1: USER → CUSTOM AGENT → PROMPT */
.pbv-cah__row--invoke {
  display: grid;
  grid-template-columns: minmax(180px, 1.2fr) 28px minmax(140px, 1fr) 28px minmax(140px, 1fr);
  align-items: center; gap: 10px;
}
.pbv-cah__user {
  display: grid; gap: 4px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  opacity: 0; transform: translateX(-8px);
  animation: pbvHeroRowIn .7s var(--ease) forwards;
}
.pbv-cah__user-eyebrow {
  font: 800 .65rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim);
}
.pbv-cah__user-cmd {
  display: inline-flex; align-items: center; gap: 4px;
  font: 700 .86rem/1.2 var(--font-mono, ui-monospace, monospace);
  color: var(--text);
}
.pbv-cah__user-slash { color: color-mix(in srgb, var(--ca-prompt) 90%, #fff); font-weight: 800; }
.pbv-cah__user-caret {
  display: inline-block; width: 7px; height: 14px; margin-left: 2px;
  background: color-mix(in srgb, var(--ca-prompt) 80%, #fff);
  animation: pbvCaCaret 1s steps(2, end) infinite;
}
.pbv-cah__node {
  display: grid; gap: 4px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border: 1px solid color-mix(in srgb, var(--ca-agent) 30%, var(--border));
  opacity: 0; transform: translateX(-8px);
  animation: pbvHeroRowIn .7s var(--ease) forwards;
}
.pbv-cah__node--agent {
  border-color: color-mix(in srgb, var(--ca-agent) 55%, var(--border));
  background: linear-gradient(160deg,
    color-mix(in srgb, var(--ca-agent) 18%, var(--surface)) 0%,
    var(--surface) 70%);
}
.pbv-cah__node--prompt {
  border-color: color-mix(in srgb, var(--ca-prompt) 55%, var(--border));
  background: linear-gradient(160deg,
    color-mix(in srgb, var(--ca-prompt) 16%, var(--surface)) 0%,
    var(--surface) 70%);
}
.pbv-cah__node--harness {
  justify-self: center; min-width: 260px; text-align: center;
  border-color: color-mix(in srgb, var(--ca-harness) 55%, var(--border));
  background: linear-gradient(160deg,
    color-mix(in srgb, var(--ca-harness) 18%, var(--surface)) 0%,
    var(--surface) 75%);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ca-harness) 18%, transparent) inset;
}
.pbv-cah__eyebrow {
  font: 800 .66rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 82%, #fff);
}
.pbv-cah__node--prompt .pbv-cah__eyebrow {
  color: color-mix(in srgb, var(--ca-prompt) 88%, #fff);
}
.pbv-cah__node--harness .pbv-cah__eyebrow {
  color: color-mix(in srgb, var(--ca-harness) 92%, #fff);
}
.pbv-cah__label { font-weight: 800; font-size: .98rem; color: var(--text); }

/* horizontal connectors with a moving dot */
.pbv-cah__connect--h {
  position: relative;
  height: 2px;
  background: color-mix(in srgb, var(--ca-agent) 45%, transparent);
  border-radius: 2px;
  opacity: 0;
  animation: pbvCahConnectIn .5s var(--ease) forwards;
}
.pbv-cah__connect--h::after {
  content: ""; position: absolute; top: -3px; left: 0;
  width: 8px; height: 8px; border-radius: 50%;
  background: color-mix(in srgb, var(--ca-agent) 90%, #fff);
  box-shadow: 0 0 10px color-mix(in srgb, var(--ca-agent) 70%, transparent);
  animation: pbvCahDot 2.6s var(--ease) infinite;
}
.pbv-cah__connect--c1 { animation-delay: 280ms; }
.pbv-cah__connect--c1::after { animation-delay: 600ms; }
.pbv-cah__connect--c2 {
  background: color-mix(in srgb, var(--ca-prompt) 45%, transparent);
  animation-delay: 640ms;
}
.pbv-cah__connect--c2::after {
  background: color-mix(in srgb, var(--ca-prompt) 90%, #fff);
  box-shadow: 0 0 10px color-mix(in srgb, var(--ca-prompt) 70%, transparent);
  animation-delay: 960ms;
}

/* Row 2: trunk down */
.pbv-cah__trunk {
  display: grid; justify-items: center; gap: 8px;
}
.pbv-cah__connect--v {
  display: block; width: 2px; height: 28px;
  background: color-mix(in srgb, var(--ca-harness) 55%, transparent);
  border-radius: 2px;
  opacity: 0;
  animation: pbvCahConnectIn .5s var(--ease) 900ms forwards;
  position: relative;
}
.pbv-cah__connect--v::after {
  content: ""; position: absolute; left: -3px; top: 0;
  width: 8px; height: 8px; border-radius: 50%;
  background: color-mix(in srgb, var(--ca-harness) 95%, #fff);
  box-shadow: 0 0 10px color-mix(in srgb, var(--ca-harness) 70%, transparent);
  animation: pbvCahDotV 2.6s var(--ease) 1200ms infinite;
}

/* Row 3: branch fan-out */
.pbv-cah__branch { display: grid; gap: 8px; }
.pbv-cah__branch-rails {
  position: relative;
  height: 22px;
}
.pbv-cah__rail {
  position: absolute; top: 0; bottom: 0;
  width: 2px;
  background: color-mix(in srgb, var(--ca-harness) 45%, transparent);
  opacity: 0;
  animation: pbvCahRailIn .4s var(--ease) forwards;
}
/* simple equally-spaced 3-column rails */
.pbv-cah__rail--a { left: calc((100% / 6) * 1); background: color-mix(in srgb, var(--ca-tools)  55%, transparent); animation-delay: 1280ms; }
.pbv-cah__rail--b { left: 50%;                  background: color-mix(in srgb, var(--ca-def)    55%, transparent); animation-delay: 1380ms; }
.pbv-cah__rail--c { left: calc((100% / 6) * 5); background: color-mix(in srgb, var(--ca-append) 55%, transparent); animation-delay: 1480ms; }
.pbv-cah__rail::after {
  content: ""; position: absolute; left: -3px; top: 0;
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
}
.pbv-cah__rail--a::after { background: color-mix(in srgb, var(--ca-tools)  90%, #fff); box-shadow: 0 0 10px color-mix(in srgb, var(--ca-tools)  70%, transparent); animation: pbvCahDotV 2.6s var(--ease) 1450ms infinite; }
.pbv-cah__rail--b::after { background: color-mix(in srgb, var(--ca-def)    90%, #fff); box-shadow: 0 0 10px color-mix(in srgb, var(--ca-def)    70%, transparent); animation: pbvCahDotV 2.6s var(--ease) 1550ms infinite; }
.pbv-cah__rail--c::after { background: color-mix(in srgb, var(--ca-append) 90%, #fff); box-shadow: 0 0 10px color-mix(in srgb, var(--ca-append) 70%, transparent); animation: pbvCahDotV 2.6s var(--ease) 1650ms infinite; }

.pbv-cah__branch-pills {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.pbv-cah__pill {
  display: grid; gap: 4px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  opacity: 0; transform: translateY(8px);
  animation: pbvCahPillIn .55s var(--ease) forwards;
}
.pbv-cah__pill--tools {
  border-color: color-mix(in srgb, var(--ca-tools) 55%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, var(--ca-tools) 14%, var(--surface)) 0%, var(--surface) 75%);
}
.pbv-cah__pill--def {
  border-color: color-mix(in srgb, var(--ca-def) 55%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, var(--ca-def) 16%, var(--surface)) 0%, var(--surface) 75%);
}
.pbv-cah__pill--append {
  border-color: color-mix(in srgb, var(--ca-append) 55%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, var(--ca-append) 14%, var(--surface)) 0%, var(--surface) 75%);
}
.pbv-cah__pill-eyebrow {
  font: 800 .62rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .14em;
  color: var(--text-dim);
}
.pbv-cah__pill--tools  .pbv-cah__pill-eyebrow { color: color-mix(in srgb, var(--ca-tools)  92%, #fff); }
.pbv-cah__pill--def    .pbv-cah__pill-eyebrow { color: color-mix(in srgb, var(--ca-def)    92%, #fff); }
.pbv-cah__pill--append .pbv-cah__pill-eyebrow { color: color-mix(in srgb, var(--ca-append) 92%, #fff); }
.pbv-cah__pill-label { font-weight: 700; font-size: .92rem; color: var(--text); }

/* hero keyframes */
@keyframes pbvCahConnectIn {
  to { opacity: 1; }
}
@keyframes pbvCahRailIn {
  to { opacity: 1; }
}
@keyframes pbvCahPillIn {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pbvCahDot {
  0%   { transform: translateX(0)     scale(.85); opacity: 0; }
  12%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translateX(100%)  scale(.85); opacity: 0; }
}
@keyframes pbvCahDotV {
  0%   { transform: translateY(0)     scale(.85); opacity: 0; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translateY(100%)  scale(.85); opacity: 0; }
}

@media (max-width: 720px) {
  .pbv-cah__row--invoke {
    grid-template-columns: 1fr;
  }
  .pbv-cah__connect--h { display: none; }
  .pbv-cah__branch-pills { grid-template-columns: 1fr; }
  .pbv-cah__branch-rails { display: none; }
  .pbv-cah__node--harness { min-width: 0; }
}

/* =========================================================================
   LEVER 6 · Phases, parallel agents, sub-agents
   ========================================================================= */
.pbv--phases-tile { position: absolute; inset: 0; display: grid;
  grid-template-rows: auto 1fr; gap: 8px; padding: 14px 16px 16px; align-items: center; }
.pbv-ph__title { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
.pbv-ph__pipe { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr;
  align-items: center; gap: 8px; }
.pbv-ph__phase { display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 14px 8px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 75%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 35%, var(--border));
  opacity: 0; animation: pbvRowFade 5.5s var(--ease) infinite; }
.pbv-ph__phase-num { font: 900 .9rem/1 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 90%, #fff); }
.pbv-ph__phase-name { font-weight: 700; color: var(--text); font-size: .82rem; }
.pbv-ph__gap { display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0;
  animation: pbvRowFade 5.5s var(--ease) infinite; }
.pbv-ph__gap-mark { color: color-mix(in srgb, var(--lever-color) 70%, #fff); font-size: 1.1rem; line-height: 1; }
.pbv-ph__gap-label { font: 700 .58rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }

/* Lever 6 hero */
.pbv--phases-hero { position: relative; display: grid;
  grid-template-rows: auto 1fr; gap: 14px; min-height: 340px; }
.pbv-phh__title { display: flex; flex-direction: column; gap: 4px; }
.pbv-phh__eyebrow { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-phh__headline { font-size: 1.08rem; font-weight: 700; color: var(--text); }
.pbv-phh__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: stretch; }
.pbv-phh__phase { display: grid; grid-template-rows: auto auto auto;
  gap: 8px; padding: 14px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 75%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 28%, var(--border));
  opacity: 0; animation: pbvHeroRowIn .7s var(--ease) forwards; }
.pbv-phh__phase-head { display: flex; flex-direction: column; gap: 2px; }
.pbv-phh__phase-num { font: 800 .68rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-phh__phase-name { font-weight: 800; color: var(--text); font-size: 1.02rem; }
.pbv-phh__phase-gather { padding: 6px 10px; border-radius: 6px;
  font: 700 .75rem/1.3 var(--font-mono, ui-monospace, monospace);
  background: color-mix(in srgb, var(--lever-color) 16%, var(--surface));
  color: var(--text); }
.pbv-phh__phase-drop { padding: 6px 10px; border-radius: 6px;
  font: 700 .72rem/1.3 var(--font-mono, ui-monospace, monospace);
  background: color-mix(in srgb, var(--text-dim) 12%, transparent);
  color: var(--text-muted); border-left: 2px solid color-mix(in srgb, var(--lever-color) 40%, transparent); }
@media (max-width: 720px) { .pbv-phh__grid { grid-template-columns: 1fr; } }

/* Lever 6 parallel agents section */
.pbv--parallel { display: grid; gap: 12px; padding: 12px 0; }
.pbv-par__spec { padding: 10px 14px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--lever-color) 14%, var(--surface));
  border-left: 3px solid color-mix(in srgb, var(--lever-color) 70%, transparent);
  font: 700 .85rem/1.3 var(--font-mono, ui-monospace, monospace); color: var(--text); }
.pbv-par__split { display: grid; gap: 8px; }
.pbv-par__lane { display: grid; grid-template-columns: 170px 1fr; align-items: center;
  gap: 12px; padding: 8px 12px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 22%, var(--border));
  opacity: 0; animation: pbvRowFade 5.5s var(--ease) infinite; }
.pbv-par__lane-label { font: 700 .85rem/1 var(--font-mono, ui-monospace, monospace); color: var(--text); }
.pbv-par__track { position: relative; height: 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 12%, transparent); overflow: hidden; }
.pbv-par__shuttle { position: absolute; top: 0; left: 0; height: 100%; width: 30%;
  border-radius: inherit;
  background: linear-gradient(90deg, color-mix(in srgb, var(--lever-color) 70%, #fff), var(--lever-color));
  animation: pbvShuttle 3s var(--ease) infinite; }
@keyframes pbvShuttle {
  0%   { transform: translateX(0); }
  50%  { transform: translateX(233%); }
  100% { transform: translateX(0); }
}
.pbv-par__lane--a .pbv-par__shuttle { background: linear-gradient(90deg, #fde68a, #fbbf24); animation-duration: 2.6s; }
.pbv-par__lane--b .pbv-par__shuttle { background: linear-gradient(90deg, #fdba74, #fb923c); animation-duration: 3.1s; }
.pbv-par__lane--c .pbv-par__shuttle { background: linear-gradient(90deg, #fca5a5, #f97316); animation-duration: 2.8s; }
.pbv-par__merge { text-align: right; font: 700 .82rem/1 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 90%, #fff); padding: 6px 14px; }

/* Lever 6 sub-agents section */
.pbv--subagents { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
  align-items: stretch; padding: 8px 0; }
.pbv-sub__main, .pbv-sub__child { display: grid; grid-template-rows: auto 1fr;
  padding: 12px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border);
  min-height: 150px; }
.pbv-sub__child { border-color: color-mix(in srgb, var(--lever-color) 45%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, var(--lever-color) 10%, var(--surface)) 0%, var(--surface) 70%); }
.pbv-sub__head { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 8px; }
.pbv-sub__child .pbv-sub__head { color: color-mix(in srgb, var(--lever-color) 85%, #fff); }
.pbv-sub__body { display: grid; gap: 6px; align-content: start; font: 600 .85rem/1.3 var(--font-mono, ui-monospace, monospace); color: var(--text-muted); }
.pbv-sub__doc { display: block; height: 8px; border-radius: 4px;
  background: color-mix(in srgb, var(--lever-color) 25%, transparent);
  opacity: 0; animation: pbvRowSlide 4s var(--ease) infinite; }
.pbv-sub__doc:nth-child(1) { width: 80%; animation-delay: .1s; }
.pbv-sub__doc:nth-child(2) { width: 65%; animation-delay: .35s; }
.pbv-sub__doc:nth-child(3) { width: 90%; animation-delay: .6s; }
.pbv-sub__doc:nth-child(4) { width: 50%; animation-delay: .85s; }
.pbv-sub__bridge { display: flex; flex-direction: column; justify-content: center;
  align-items: center; gap: 8px; min-width: 130px; }
.pbv-sub__bridge-out, .pbv-sub__bridge-in {
  font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  padding: 6px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--lever-color) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 40%, transparent);
  color: color-mix(in srgb, var(--lever-color) 92%, #fff); }
.pbv-sub__bridge-out { animation: pbvBridgeOut 3.4s var(--ease) infinite; }
.pbv-sub__bridge-in  { animation: pbvBridgeIn  3.4s var(--ease) infinite; }
@keyframes pbvBridgeOut {
  0%, 12%   { transform: translateX(-12px); opacity: 0; }
  30%, 45%  { transform: translateX(0); opacity: 1; }
  60%, 100% { transform: translateX(12px); opacity: 0; }
}
@keyframes pbvBridgeIn {
  0%, 45%   { transform: translateX(12px); opacity: 0; }
  60%, 80%  { transform: translateX(0); opacity: 1; }
  95%, 100% { transform: translateX(-12px); opacity: 0; }
}
@media (max-width: 720px) {
  .pbv--subagents { grid-template-columns: 1fr; }
  .pbv-sub__bridge { flex-direction: row; }
}

/* =========================================================================
   LEVER 5 · Divide and conquer (section visual)
   Three swim lanes — /research, /plan, /fleet — blocks slide in left → right,
   handoff blocks bridge lanes vertically.
   ========================================================================= */
.pbv--divide-conquer { display: grid; gap: 14px; padding: 6px 0 8px;
  --dac-sys:      #34d399;
  --dac-prompt:   #a855f7;
  --dac-file:     #facc15;
  --dac-bad:      #f87171;
  --dac-good:     #34d399;
  --dac-handoff:  #38bdf8;
  --dac-reason:   #94a3b8;
  --dac-spec:     #38bdf8;
  --dac-change:   #fb923c;
  --dac-lane-bg:  color-mix(in srgb, #14532d 30%, transparent);
}
.pbv-dac__title { display: flex; flex-direction: column; gap: 4px; }
.pbv-dac__eyebrow { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-dac__headline { font-size: 1.04rem; font-weight: 700; color: var(--text); }
.pbv-dac__bubble { align-self: start; max-width: 340px;
  padding: 8px 12px; border-radius: 8px;
  font: 500 .82rem/1.35 var(--font-mono, ui-monospace, monospace);
  color: var(--text); background: color-mix(in srgb, #a855f7 18%, var(--surface));
  border: 1px solid color-mix(in srgb, #a855f7 40%, var(--border));
  position: relative;
  opacity: 0; animation: pbvDacBubble 5.5s var(--ease) infinite; }
.pbv-dac__bubble::after { content: ""; position: absolute; left: 28px; bottom: -8px;
  width: 14px; height: 14px; transform: rotate(45deg);
  background: inherit; border-right: inherit; border-bottom: inherit; border-radius: 2px; }
.pbv-dac__lane { display: grid; grid-template-columns: 140px 1fr; align-items: center;
  gap: 12px; padding: 8px 10px; border-radius: var(--radius-sm);
  background: var(--dac-lane-bg);
  border: 1px solid color-mix(in srgb, #14532d 60%, var(--border));
  opacity: 0; animation: pbvDacLane 5.5s var(--ease) infinite; }
.pbv-dac__tag { display: flex; flex-direction: column; gap: 2px; padding-left: 4px; }
.pbv-dac__tag-name { font: 800 .82rem/1 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 90%, #fff);
  text-transform: uppercase; letter-spacing: .08em; }
.pbv-dac__tag-model { font: 600 .65rem/1.2 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
.pbv-dac__strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.pbv-dac__blk { display: inline-flex; align-items: center; padding: 6px 9px;
  border-radius: 6px; font: 700 .68rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .04em; color: #0f172a;

 * Exposed on TO.utils. No framework, no build step.

(function (TO) {

  utils.el = function (tag, attrs, children) {

    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        if (key === "class") node.className = attrs[key];
        else if (key === "html") node.innerHTML = attrs[key];
        else if (key === "text") node.textContent = attrs[key];
        else if (key.indexOf("on") === 0 && typeof attrs[key] === "function") {
          node.addEventListener(key.slice(2).toLowerCase(), attrs[key]);
        } else if (attrs[key] != null && attrs[key] !== false) {
          node.setAttribute(key, attrs[key]);

    if (children != null) {
      (Array.isArray(children) ? children : [children]).forEach(function (child) {
        if (child == null) return;

    return parts.join(".");

   *  currency formatting via Intl when available — symbol position, decimal
   *  marker, and grouping all follow the active language. */
  utils.formatUsd = function (n) {

    if (n == null || isNaN(n)) return "$0.00";

  utils.formatTokens = function (n) {
    if (TO.i18n && TO.i18n.format) return TO.i18n.format.tokens(n);
    if (n == null || isNaN(n)) return "0";
    if (Math.abs(n) >= 1e6) return utils.formatNumber(n / 1e6, 2) + "M";
    if (Math.abs(n) >= 1e3) return utils.formatNumber(n / 1e3, 1) + "k";
    return utils.formatNumber(n);

  utils.clamp = function (v, min, max) { return Math.min(max, Math.max(min, v)); };

/**
 * store.js — Tiny observable state container.
 *
 * Single source of UI state. Views subscribe to the keys they care about and
 * re-render on change. Keeps view modules decoupled — they never reach into
 * each other, only into the store.
 */
(function (TO) {
  "use strict";

  var THEME_KEY = "token-optimizer.theme";

  var state = {
    view: null,            // active view id
    theme: "dark",         // 'dark' | 'light'
    activeScenario: null,  // scenario id open in the detail modal
    scenarioFilter: "all", // category filter in the gallery
    scenarioSearch: "",    // search query in the gallery
    activePillar: null     // pillar id selected in the diagram
  };

  var listeners = {};       // key -> [fn]

  function emit(key) {
    (listeners[key] || []).forEach(function (fn) { fn(state[key], state); });
    (listeners["*"] || []).forEach(function (fn) { fn(state); });
  }

  var store = {
    get: function (key) { return key ? state[key] : state; },

    set: function (key, value) {
      if (state[key] === value) return;
      state[key] = value;
      emit(key);
    },

    /** Subscribe to a state key (or '*' for any change). Returns an unsubscribe fn. */
    subscribe: function (key, fn) {
      (listeners[key] = listeners[key] || []).push(fn);
      return function () {
        listeners[key] = (listeners[key] || []).filter(function (f) { return f !== fn; });
      };
    },

    /** Theme is persisted; everything else is session-only. */
    loadTheme: function (fallback) {
      var saved;
      try { saved = localStorage.getItem(THEME_KEY); } catch (e) { saved = null; }
      state.theme = saved === "light" || saved === "dark" ? saved : (fallback || "dark");
      return state.theme;
    },

    toggleTheme: function () {
      state.theme = state.theme === "dark" ? "light" : "dark";
      try { localStorage.setItem(THEME_KEY, state.theme); } catch (e) { /* storage off */ }
      emit("theme");
      return state.theme;
    }
  };

  TO.store = store;
})(window.TO = window.TO || {});

/**
 * router.js — Hash-based view router.
 *
 * Hash routing works identically from file:// and from a static host, so the
 * app needs no server-side rewrite rules. Format: #/view  or  #/view/param.
 */
(function (TO) {
  "use strict";

  var router = {
    routes: {},   // viewId -> view module
    fallback: "home",
    onChange: null // fn(viewId, param) invoked after a route resolves
  };

  /** Register a view module under its id. */
  router.register = function (viewId, viewModule) {
    router.routes[viewId] = viewModule;
  };

  function parseHash() {
    var raw = (location.hash || "").replace(/^#\/?/, "");
    var parts = raw.split("/").filter(Boolean);
    return { view: parts[0] || router.fallback, param: parts[1] || null };
  }

  /** Resolve the current hash to a view; called on load and on hashchange. */
  router.resolve = function () {
    var route = parseHash();
    var viewId = router.routes[route.view] ? route.view : router.fallback;
    if (router.onChange) router.onChange(viewId, route.param);
  };

  /** Navigate programmatically. */
  router.go = function (viewId, param) {
    var hash = "#/" + viewId + (param ? "/" + param : "");
    if (location.hash === hash) router.resolve();   // same hash: re-resolve manually
    else location.hash = hash;
  };

  router.start = function () {
    window.addEventListener("hashchange", router.resolve);
    router.resolve();
  };

  TO.router = router;
})(window.TO = window.TO || {});

/**
 * scenarios.js — Context Rot Scenarios view.
 *
 * A searchable, filterable card grid of every scenario. Clicking a card opens
 * a detail popup (modal). Click the overlay, press Esc, or hit the close
 * button to dismiss. Deep-link via #/scenarios/<id> still opens the modal.
 */

  "use strict";

  var el = TO.utils.el;
  var store = TO.store;
  var t  = function (k, vars) { return TO.i18n ? TO.i18n.t(k, vars) : k; };

  var modalStack = [];
  var keydownBound = false;

  function bindKeydown() {
    if (keydownBound) return;

      if (e.key === "Escape" && modalStack.length) {

      (opts.size ? " modal-card--" + opts.size : "") });

      "aria-label": t("scenarios.close") });
    closeBtn.innerHTML = "&times;";
    closeBtn.addEventListener("click", function () { closeModal(overlay); });

    card.appendChild(closeBtn);
    card.appendChild(content);

    requestAnimationFrame(function () { overlay.classList.add("is-open"); });

      // Stage 3 — outcomes
      var outcomesSection = el("section", { class: "section" }, [
        el("div", { class: "container" }, [
          el("div", { class: "section-head reveal" }, [
            el("span", { class: "eyebrow", text: t("diagram.stage3Eyebrow") }),
            el("h2",   { text: t("diagram.stage3Title") })
          ]),
          el("div", { class: "outcome-grid" }, cfg.outcomes.map(function (o) {
            return el("div", { class: "outcome-card reveal" }, [
              el("div", { class: "outcome-metric", text: o.metric }),
              el("div", { class: "outcome-label",  text: o.label }),
              el("div", { class: "outcome-note",   text: o.note })
            ]);
          }))
        ])
      ]);

      root.appendChild(diagnosis);
      root.appendChild(pillarSection);
      root.appendChild(outcomesSection);

      // keep the hub highlight in sync with selection
      store.subscribe("activePillar", function (id) {
        TO.utils.qsa(".hub-node", root).forEach(function (n) {
          n.classList.toggle("is-active", n.dataset.pillar === id);
        });
        TO.utils.qsa(".hub-spoke", root).forEach(function (sp) {
          sp.classList.toggle("is-active", sp.dataset.spoke === id);
        });
        view.renderPanel(detailPanel, id);
      });
    },

    renderPanel: function (host, pillarId) {
      TO.utils.clear(host);
      var pillar = (TO.data.uiConfig.pillars || []).filter(function (p) {
        return p.id === pillarId;
      })[0];

      if (!pillar) {
        host.appendChild(el("div", { class: "pillar-panel-empty" }, [
          el("div", { class: "pillar-panel-empty-mark", text: "✲" }),
          el("p", { text: t("diagram.emptyPanel") })
        ]));
        return;
      }

      var related = (TO.data.scenarios || []).filter(function (s) {
        return (pillar.scenarios || []).indexOf(s.id) !== -1;
      });
      var scenarioLinks = el("div", { class: "panel-scenarios" }, related.map(function (s) {
        var b = el("button", { type: "button", class: "panel-scenario-link" }, [
          el("span", { class: "panel-scenario-title", text: s.title }),
          el("span", { class: "panel-scenario-impact", text: s.impact.headline })
        ]);
        b.addEventListener("click", function () { TO.router.go("scenarios", s.id); });
        return b;
      }));

      var panel = el("div", { class: "pillar-panel-inner" }, [
        el("div", { class: "panel-top" }, [
          el("span", { class: "panel-num", text: pillar.num }),
          el("div", {}, [
            el("h3", { class: "panel-name", text: pillar.name }),
            el("p", { class: "panel-principle", text: pillar.principle })
          ])
        ]),
        el("p", { class: "panel-detail", text: pillar.detail }),
        el("div", { class: "panel-meta" }, [
          el("div", { class: "panel-meta-item" }, [
            el("span", { class: "panel-meta-label", text: t("diagram.primaryLever") }),
            el("span", { class: "panel-meta-value", text: pillar.lever })
          ]),
          el("div", { class: "panel-meta-item" }, [
            el("span", { class: "panel-meta-label", text: t("diagram.contribution") }),
            el("span", { class: "panel-meta-value", text: pillar.contribution })
          ])
        ]),
        el("h4", { class: "detail-subhead", text: t("diagram.scenariosHere") }),
        scenarioLinks
      ]);
      panel.style.setProperty("--pillar-color", pillar.color);
      host.appendChild(panel);
    },

    show: function (param) {
      var root = document.getElementById("view-diagram");
      TO.utils.observeReveals(root);
      var valid = (TO.data.uiConfig.pillars || []).some(function (p) { return p.id === param; });
      store.set("activePillar", valid ? param : (store.get("activePillar") || null));
      // ensure panel reflects current state even if value unchanged
      view.renderPanel(document.getElementById("pillar-panel"), store.get("activePillar"));
      TO.utils.qsa(".hub-node", root).forEach(function (n) {
        n.classList.toggle("is-active", n.dataset.pillar === store.get("activePillar"));
      });
      TO.utils.qsa(".hub-spoke", root).forEach(function (sp) {
        sp.classList.toggle("is-active", sp.dataset.spoke === store.get("activePillar"));
      });
    }
  };

  TO.views = TO.views || {};
  TO.views.diagram = view;
})(window.TO = window.TO || {});
</script>
  <script>
/**
 * calculator.js — Cost & Pricing Calculator.
 * Prices a turn across selected models, compares them, and recommends a fit.
 * All rates come from TO.data.pricing — no price is hard-coded here.
 */
(function (TO) {
  "use strict";

  var el = TO.utils.el;
  var fmtUsd = TO.utils.formatUsd;
  var fmtTok = TO.utils.formatTokens;
  var fmtNum = TO.utils.formatNumber;
  var t  = function (k, vars) { return TO.i18n ? TO.i18n.t(k, vars) : k; };
  var tryT = function (k, vars) { return TO.i18n ? TO.i18n.tryT(k, vars) : undefined; };

  function pricingText(path, fallback, vars) {
    return tryT("pricing." + path, vars) || fallback;
  }
  function tierName(tier) { return pricingText("tiers." + tier.id + ".name", tier.name); }
  function tierBlurb(tier) { return pricingText("tiers." + tier.id + ".blurb", tier.blurb); }
  function effortName(effort) { return pricingText("effort." + effort.id + ".name", effort.name); }
  function effortBlurb(effort) { return pricingText("effort." + effort.id + ".blurb", effort.blurb); }

  // Quick-fill presets — typical token mixes for common workloads.
  // `label` is the en fallback; the translated label is resolved via calc.presets.<id>.
  var PRESETS = [
    { id: "qa",     label: "Quick Q&A",     input: 1500,  cached: 8000,  output: 400,  turns: 1,  effort: "low" },
    { id: "refactor", label: "Daily refactor", input: 6000, cached: 20000, output: 1200, turns: 6,  effort: "medium" },
    { id: "agent",  label: "Agent task",    input: 15000, cached: 30000, output: 3000, turns: 20, effort: "medium" },
    { id: "session", label: "Long session", input: 50000, cached: 40000, output: 2000, turns: 30, effort: "medium" }
  ];

  var view = {
    id: "calculator",
    state: {
      input: 6000, cached: 20000, output: 1200, turns: 6,
      effort: "low", autoMode: true, planId: "business",
      selected: {} // modelId -> true
    },

    mount: function (root) {
      var pricing = TO.data.pricing;
      // default selection: one model per tier
      ["gpt-5-mini", "claude-sonnet-4-6", "claude-opus-4-7"].forEach(function (id) {
        view.state.selected[id] = true;
      });

      var resultsHost = el("div", { class: "calc-results", id: "calc-results" });

      root.appendChild(el("section", { class: "section" }, [
        el("div", { class: "container" }, [
          el("div", { class: "section-head reveal" }, [
            el("span", { class: "eyebrow", text: t("calc.eyebrow") }),
            el("h2", { text: t("calc.title") }),
            el("p", { class: "section-lead", text: t("calc.lead") })
          ]),
          el("div", { class: "calc-layout reveal" }, [
            view.buildControls(),
            resultsHost
          ]),
          el("p", { class: "calc-disclaimer reveal", text:
            pricingText("meta.note", pricing.meta.note) + " · " + t("calc.sourceLabel") + ": " +
            pricingText("meta.source", pricing.meta.source) + " · " +
            pricingText("meta.effective", pricing.meta.effective) })
        ])
      ]));

      view.recalc();
    },

    /** Left-hand control column: token inputs, presets, options, model picker. */
    buildControls: function () {
      var pricing = TO.data.pricing;

      function tokenField(key, label, min, max, step) {
        var range = el("input", { type: "range", min: min, max: max, step: step,
          value: view.state[key], class: "calc-range", "aria-label": label });
        var number = el("input", { type: "number", min: min, max: max * 4, step: step,
          value: view.state[key], class: "calc-number", "aria-label": t("calc.exactAria", { label: label }) });
        function sync(v, fromNumber) {
          v = TO.utils.clamp(parseInt(v, 10) || 0, 0, max * 4);
          view.state[key] = v;
          if (!fromNumber) number.value = v;
          range.value = TO.utils.clamp(v, min, max);
          view.recalc();
        }
        range.addEventListener("input", function () { sync(range.value, false); });
        number.addEventListener("input", function () { sync(number.value, true); });
        return el("div", { class: "calc-field" }, [
          el("label", { class: "calc-field-label" }, [
            el("span", { text: label }),
            number
          ]),
          range
        ]);
      }

      // presets
      var presetRow = el("div", { class: "preset-row" }, PRESETS.map(function (p) {
        var b = el("button", { type: "button", class: "chip chip--preset",
          text: tryT("calc.presets." + p.id) || p.label });
        b.addEventListener("click", function () {
          view.state.input = p.input; view.state.cached = p.cached;
          view.state.output = p.output; view.state.turns = p.turns;
          view.state.effort = p.effort;
          view.refreshControls();
          view.recalc();
        });
        return b;
      }));

      // effort selector
      var effortSel = el("select", { class: "calc-select", "aria-label": t("calc.reasoningEffort") },
        pricing.effortLevels.map(function (e) {
           return el("option", { value: e.id }, effortName(e) + " — " + effortBlurb(e));
        }));
      effortSel.value = view.state.effort;
      effortSel.addEventListener("change", function () {
        view.state.effort = effortSel.value; view.recalc();
      });

      // plan selector
      var planSel = el("select", { class: "calc-select", "aria-label": t("calc.plan") },
        pricing.plans.map(function (p) {
          return el("option", { value: p.id }, t("calc.planOption", {
            name: pricingText("plans." + p.id, p.name),
            credits: fmtNum(p.includedCredits)
          }));
        }));
      planSel.value = view.state.planId;
      planSel.addEventListener("change", function () {
        view.state.planId = planSel.value; view.recalc();
      });

      // turns
      var turnsInput = el("input", { type: "number", min: 1, max: 200, value: view.state.turns,
        class: "calc-number calc-number--wide", "aria-label": t("calc.sessionTurns") });
      turnsInput.addEventListener("input", function () {
        view.state.turns = TO.utils.clamp(parseInt(turnsInput.value, 10) || 1, 1, 999);
        view.recalc();
      });

      // auto mode toggle
      var autoToggle = el("input", { type: "checkbox", class: "calc-check" });
      autoToggle.checked = view.state.autoMode;
      autoToggle.addEventListener("change", function () {
        view.state.autoMode = autoToggle.checked; view.recalc();
      });

      // model picker grouped by vendor → tier, collapsible, with select all/none
      var vendors = [];
      var vendorMap = {};
      pricing.models.forEach(function (m) {
        if (!vendorMap[m.vendor]) {
          vendorMap[m.vendor] = [];
          vendors.push(m.vendor);
        }
        vendorMap[m.vendor].push(m);
      });

      var modelGroups = vendors.map(function (vendor) {
        var vendorModels = vendorMap[vendor];
        // sub-group by tier within vendor
        var tierGroups = pricing.tiers.map(function (tier) {
          var models = vendorModels.filter(function (m) { return m.tier === tier.id; });
          if (!models.length) return null;
          var rows = models.map(function (m) {
            var cb = el("input", { type: "checkbox", class: "calc-check", "data-model": m.id });
            cb.checked = !!view.state.selected[m.id];
            cb.addEventListener("change", function () {
              view.state.selected[m.id] = cb.checked;
              updateVendorToggle();
              view.recalc();
            });
            return el("label", { class: "model-pick" }, [
              cb,
              el("span", { class: "model-pick-name", text: m.name }),
              el("span", { class: "model-pick-rate",
                text: t("calc.outputRate", { rate: "$" + m.output }) }),
              m.included ? el("span", { class: "model-pick-badge", text: t("calc.included") }) : null
            ]);
          });
          return el("div", { class: "model-tier-sub" }, [
            el("div", { class: "model-tier-label" }, [
              el("span", { class: "tier-dot", style: "background:" + tier.color }),
              el("span", { text: tierName(tier) })
            ]),
            el("div", { class: "model-group-list" }, rows)
          ]);
        }).filter(Boolean);

        // vendor header with toggle all / expand-collapse
        var toggleBtn = el("button", { type: "button", class: "chip chip--vendor-toggle",
          text: "All" });
        var listWrap = el("div", { class: "model-vendor-body" }, tierGroups);

        function updateVendorToggle() {
          var all = vendorModels.every(function (m) { return view.state.selected[m.id]; });
          toggleBtn.textContent = all ? "None" : "All";
        }
        toggleBtn.addEventListener("click", function () {
          var all = vendorModels.every(function (m) { return view.state.selected[m.id]; });
          var next = !all;
          vendorModels.forEach(function (m) { view.state.selected[m.id] = next; });
          // sync checkboxes
          var cbs = listWrap.querySelectorAll("input[data-model]");
          for (var i = 0; i < cbs.length; i++) cbs[i].checked = next;
          updateVendorToggle();
          view.recalc();
        });

        var expandBtn = el("button", { type: "button", class: "chip chip--vendor-expand",
          "aria-label": "Expand " + vendor });
        expandBtn.innerHTML = "&#9662;";
        expandBtn.addEventListener("click", function () {
          var open = group.classList.toggle("is-collapsed");
          expandBtn.innerHTML = open ? "&#9656;" : "&#9662;";
        });

        updateVendorToggle();

        var group = el("div", { class: "model-group" }, [
          el("div", { class: "model-group-head" }, [
            expandBtn,
            el("span", { class: "model-group-name", text: vendor }),
            el("span", { class: "model-group-count", text: vendorModels.length + " models" }),
            toggleBtn
          ]),
          listWrap
        ]);
        return group;
      });

      view._controls = {
        inputField: tokenField("input", t("calc.inputTokens"), 0, 60000, 500),
        cachedField: tokenField("cached", t("calc.cachedTokens"), 0, 60000, 500),
        outputField: tokenField("output", t("calc.outputTokens"), 0, 8000, 100),
        effortSel: effortSel, planSel: planSel, turnsInput: turnsInput, autoToggle: autoToggle
      };

      return el("div", { class: "calc-controls" }, [
        el("h3", { class: "calc-block-title", text: t("calc.tokenMix") }),
        el("div", { class: "preset-label", text: t("calc.quickFill") }),
        presetRow,
        view._controls.inputField,
        view._controls.cachedField,
        view._controls.outputField,
        el("div", { class: "calc-options" }, [
          el("div", { class: "calc-opt" }, [
            el("span", { class: "calc-opt-label", text: t("calc.reasoningEffort") }), effortSel
          ]),
          el("div", { class: "calc-opt" }, [
            el("span", { class: "calc-opt-label", text: t("calc.sessionTurns") }), turnsInput
          ]),
          el("div", { class: "calc-opt" }, [
            el("span", { class: "calc-opt-label", text: t("calc.plan") }), planSel
          ]),
          el("label", { class: "calc-opt calc-opt--toggle" }, [
            autoToggle,
            el("span", {}, [
              el("span", { class: "calc-opt-label", text: t("calc.autoLabel") }),
              el("span", { class: "calc-opt-hint", text: t("calc.autoHint") })
            ])
          ])
        ]),
        el("h3", { class: "calc-block-title", text: t("calc.modelsToCompare") }),
        el("div", { class: "model-picker" }, modelGroups)
      ]);
    },

    /** Reflect state back into the control DOM (used after a preset). */
    refreshControls: function () {
      var c = view._controls;
      ["input", "cached", "output"].forEach(function (key) {
        var field = c[key + "Field"];
        TO.utils.qs(".calc-range", field).value = view.state[key];
        TO.utils.qs(".calc-number", field).value = view.state[key];
      });
      c.effortSel.value = view.state.effort;
      c.turnsInput.value = view.state.turns;
    },

    /** Pure cost function for one model given current state. */
    computeModel: function (m) {
      var pricing = TO.data.pricing;
      var P = pricing.meta.rateUnit;
      var st = view.state;
      var effort = pricing.effortLevels.filter(function (e) { return e.id === st.effort; })[0];
      var mult = effort ? effort.multiplier : 1;
      var billedOutput = st.output * mult;

      var inCost = st.input / P * m.input;
      var cacheCost = st.cached / P * m.cached;
      var outCost = billedOutput / P * m.output;
      var discount = st.autoMode ? (1 - pricing.meta.autoModeDiscount) : 1;

      var perTurn = (inCost + cacheCost + outCost) * discount;
      var total = perTurn * st.turns;
      return {
        model: m,
        inCost: inCost * discount, cacheCost: cacheCost * discount, outCost: outCost * discount,
        perTurn: perTurn, total: total,
        credits: total / pricing.meta.creditValueUsd,
        billedOutput: billedOutput
      };
    },

    recalc: function () {
      var host = document.getElementById("calc-results");
      if (!host) return;
      TO.utils.clear(host);

      var pricing = TO.data.pricing;
      var chosen = pricing.models.filter(function (m) { return view.state.selected[m.id]; });

      if (!chosen.length) {
        host.appendChild(el("div", { class: "calc-empty" }, [
          el("p", { text: t("calc.emptyModels") })
        ]));
        return;
      }

      var rows = chosen.map(view.computeModel).sort(function (a, b) {
        return a.total - b.total;
      });
      var cheapest = rows[0], priciest = rows[rows.length - 1];
      var maxTotal = priciest.total || 1;
      var plan = pricing.plans.filter(function (p) { return p.id === view.state.planId; })[0];

      // headline
      var spread = cheapest.total > 0 ? (priciest.total / cheapest.total) : 1;
      host.appendChild(el("div", { class: "calc-headline" }, [
        el("div", { class: "calc-headline-main" }, [
          el("span", { class: "calc-headline-label", text: t("calc.lowestCost") }),
          el("span", { class: "calc-headline-value", text: fmtUsd(cheapest.total) }),
          el("span", { class: "calc-headline-model", text: cheapest.model.name })
        ]),
        el("div", { class: "calc-headline-sub" }, [
          el("div", { class: "calc-kpi" }, [
            el("span", { class: "calc-kpi-v", text: fmtNum(cheapest.credits, cheapest.credits < 10 ? 1 : 0) }),
            el("span", { class: "calc-kpi-l", text: t("calc.aiCredits") })
          ]),
          el("div", { class: "calc-kpi" }, [
            el("span", { class: "calc-kpi-v", text: spread.toFixed(1) + "×" }),
            el("span", { class: "calc-kpi-l", text: t("calc.spreadLabel") })
          ]),
          el("div", { class: "calc-kpi" }, [
            el("span", { class: "calc-kpi-v",
              text: (cheapest.credits / plan.includedCredits * 100).toFixed(2) + "%" }),
            el("span", { class: "calc-kpi-l", text: t("calc.monthlyAllowance", {
              plan: pricingText("plans." + plan.id, plan.name)
            }) })
          ])
        ])
      ]));

      // comparison bars
      var bars = el("div", { class: "calc-bars" }, rows.map(function (r) {
        var tier = pricing.tiers.filter(function (t) { return t.id === r.model.tier; })[0];
        var fill = el("div", { class: "calc-bar-fill" });
        fill.style.background = tier ? tier.color : "#818cf8";
        fill.style.width = "0%";
        fill.dataset.target = (r.total / maxTotal * 100).toFixed(1);
        return el("div", { class: "calc-bar-row" + (r === cheapest ? " is-best" : "") }, [
          el("div", { class: "calc-bar-name" }, [
            el("span", { text: r.model.name }),
            r === cheapest ? el("span", { class: "best-tag", text: t("calc.bestValue") }) : null
          ]),
          el("div", { class: "calc-bar-track" }, [fill]),
          el("div", { class: "calc-bar-cost", text: fmtUsd(r.total) })
        ]);
      }));
      host.appendChild(el("div", { class: "calc-result-block" }, [
        el("h3", { class: "calc-block-title", text: t("calc.sessionCost", { count: view.state.turns }) }),
        bars
      ]));

      // breakdown cards
      var cards = el("div", { class: "calc-breakdown" }, rows.map(function (r) {
        var sum = r.inCost + r.cacheCost + r.outCost || 1;
        function seg(cls, val) {
          var d = el("div", { class: "split-seg split-seg--" + cls });
          d.style.width = (val / sum * 100) + "%";
          return d;
        }
        return el("div", { class: "breakdown-card" }, [
          el("div", { class: "breakdown-head" }, [
            el("span", { class: "breakdown-name", text: r.model.name }),
            el("span", { class: "breakdown-vendor", text: r.model.vendor })
          ]),
          el("div", { class: "split-bar" }, [
            seg("in", r.inCost), seg("cache", r.cacheCost), seg("out", r.outCost)
          ]),
          el("dl", { class: "breakdown-list" }, [
            el("div", {}, [el("dt", { text: t("calc.inputShort") }), el("dd", { text: fmtUsd(r.inCost * view.state.turns) })]),
            el("div", {}, [el("dt", { text: t("calc.cachedShort") }), el("dd", { text: fmtUsd(r.cacheCost * view.state.turns) })]),
            el("div", {}, [el("dt", { text: t("calc.outputShort") }), el("dd", { text: fmtUsd(r.outCost * view.state.turns) })]),
            el("div", { class: "breakdown-total" }, [
              el("dt", { text: t("calc.perTurn") }), el("dd", { text: fmtUsd(r.perTurn) })])
          ])
        ]);
      }));
      host.appendChild(el("div", { class: "calc-result-block" }, [
        el("h3", { class: "calc-block-title", text: t("calc.costBreakdown") }),
        el("div", { class: "split-legend" }, [
          el("span", { class: "lg lg--in", text: t("calc.inputShort") }),
          el("span", { class: "lg lg--cache", text: t("calc.cachedShort") }),
          el("span", { class: "lg lg--out", text: t("calc.outputShort") })
        ]),
        cards
      ]));

      // recommendation
      host.appendChild(view.buildRecommendation(rows, cheapest, priciest));

      requestAnimationFrame(function () {
        TO.utils.qsa(".calc-bar-fill", host).forEach(function (f) {
          f.style.width = f.dataset.target + "%";
        });
      });
    },

    buildRecommendation: function (rows, cheapest, priciest) {
      var st = view.state;
      var outShare = (cheapest.inCost + cheapest.cacheCost + cheapest.outCost) > 0
        ? cheapest.outCost / (cheapest.inCost + cheapest.cacheCost + cheapest.outCost) : 0;
      var lines = [];

      lines.push(t("calc.recommend.lowest", {
        model: cheapest.model.name,
        total: fmtUsd(cheapest.total),
        delta: fmtUsd(priciest.total - cheapest.total),
        priciest: priciest.model.name
      }));

      if (outShare > 0.55) {
        lines.push(t("calc.recommend.outputDominates", { percent: Math.round(outShare * 100) + "%" }));
      } else if (st.cached > st.input * 1.5) {
        lines.push(t("calc.recommend.cachedHealthy"));
      } else {
        lines.push(t("calc.recommend.inputDrives"));
      }

      if (st.effort === "high" || st.effort === "max") {
        lines.push(t("calc.recommend.highEffort", { effort: st.effort.toUpperCase() }));
      }
      if (!st.autoMode) {
        lines.push(t("calc.recommend.autoOff"));
      }

      var goPlaybook = el("button", { type: "button", class: "btn btn--primary btn--sm",
        text: t("calc.guidedRecommendation") });
      goPlaybook.addEventListener("click", function () { TO.router.go("playbook"); });

  var view = {
    id: "playbook",
    activeLeverId: null,

    mount: function (root) {
      var data = TO.data.playbookLevers;
      var grid = el("div", { class: "pb-lever-grid", id: "pb-lever-grid" },
        data.levers.map(function (lever, i) {

      var detail = el("div", { class: "pb-lever-detail", id: "pb-lever-detail", "aria-live": "polite" });

        el("div", { class: "container" }, [
          el("div", { class: "section-head reveal" }, [
            el("span", { class: "eyebrow", text: t("playbook.eyebrow") }),
            el("h2", { text: t("playbook.title") }),
            el("p", { class: "section-lead", text: tryT("playbook.intro") || data.intro })
          ]),
          grid,
          detail
        ])
      ]));
    },

    /* ---------- LEVER CARD ---------- */
    renderLeverCard: function (lever, index) {
      var name    = leverField(lever, "name");
      var tagline = leverField(lever, "tagline");
      var summary = leverField(lever, "summary");
      var tileVisual = lever.customVisual && visuals[lever.customVisual]
        ? visuals[lever.customVisual]({ lever: lever, variant: "tile" })
        : el("img", { class: "pb-lever-image", src: lever.heroImage, alt: "", loading: "lazy" });
      var wrapClass = "pb-lever-image-wrap" + (lever.customVisual ? " pb-lever-image-wrap--custom" : "");
      var card = el("button", {
        type: "button",
        class: "pb-lever-card reveal",
        "data-lever-id": lever.id,
        "aria-label": t("playbook.openAria", { num: lever.num, name: name }),
        onclick: function () { view.openLever(lever.id); }
      }, [
        el("div", { class: wrapClass }, [tileVisual]),
        el("div", { class: "pb-lever-body" }, [
          el("div", { class: "pb-lever-head" }, [
            el("span", { class: "pb-lever-num", text: padNum(lever.num) }),
            el("h3", { class: "pb-lever-name", text: name })
          ]),
          el("p", { class: "pb-lever-tagline", text: tagline }),
          el("p", { class: "pb-lever-summary", text: summary }),
          lever.stats && lever.stats.length ? el("div", { class: "pb-lever-stats" }, lever.stats.map(function (s, i) {
            return el("div", { class: "pb-lever-stat" }, [
              el("span", { class: "pb-lever-stat-value", text: s.value }),
              el("span", { class: "pb-lever-stat-label", text: leverStatLabel(lever, i, s.label) })
            ]);
          })) : null,
          el("span", { class: "pb-lever-cta", text: t("playbook.explore") })
        ])
      ]);
      card.style.setProperty("--lever-color", lever.color);
      card.style.transitionDelay = Math.min(index * 60, 540) + "ms";
      return card;
    },

    /* ---------- OPEN / CLOSE ---------- */
    openLever: function (id) {
      var lever = findLever(id);
      if (!lever) return;
      view.activeLeverId = id;
      var grid = document.getElementById("pb-lever-grid");
      var detail = document.getElementById("pb-lever-detail");
      if (!grid || !detail) return;

      grid.classList.add("is-hidden");
      TO.utils.clear(detail);
      detail.appendChild(view.renderLeverDetail(lever));
      detail.classList.add("is-open");
      // Re-attach reveal observer to newly inserted nodes.
      TO.utils.observeReveals(detail);

      // Smooth scroll to top of detail.
      requestAnimationFrame(function () {
        var top = detail.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: top, behavior: "smooth" });
      });
    },

    closeLever: function () {
      var grid = document.getElementById("pb-lever-grid");
      var detail = document.getElementById("pb-lever-detail");
      if (!grid || !detail) return;
      detail.classList.remove("is-open");
      grid.classList.remove("is-hidden");
      TO.utils.clear(detail);
      view.activeLeverId = null;
      requestAnimationFrame(function () {
        var top = grid.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: top, behavior: "smooth" });
      });
    },

    /* ---------- DETAIL PANEL ---------- */
    renderLeverDetail: function (lever) {
      var name    = leverField(lever, "name");
      var tagline = leverField(lever, "tagline");
      var summary = leverField(lever, "summary");
      var panel = el("article", { class: "pb-lever-extended" }, [
        el("div", { class: "pb-extended-bar" }, [

            el("span", { class: "pb-extended-num", text: padNum(lever.num) }),
            el("h2", { class: "pb-extended-title", text: name }),
            el("p", { class: "pb-extended-tagline", text: tagline }),
            el("p", { class: "pb-extended-summary", text: summary })

          el("div", { class: "pb-extended-hero" + (lever.customHero || lever.customVisual ? " pb-extended-hero--custom" : "") }, [

              ? visuals[lever.customHero]({ lever: lever, variant: "hero" })
              : (lever.customVisual && visuals[lever.customVisual])
                ? visuals[lever.customVisual]({ lever: lever, variant: "hero" })
                : el("img", { src: lever.heroImage,
                    alt: t("playbook.heroAlt", { name: name }), loading: "lazy" })
          ])
        ]),

        el("div", { class: "pb-extended-sections" },
          (lever.extended || []).map(function (section, i) {
            return view.renderSection(section, i);
          })
        ),

        el("div", { class: "pb-extended-foot" }, [
          el("button", {
            type: "button", class: "btn btn--primary pb-extended-back",
            onclick: function () { view.closeLever(); }
          }, [el("span", { text: t("playbook.backToTen") })])
        ])
      ]);
      panel.style.setProperty("--lever-color", lever.color);
      return panel;
    },

    renderSection: function (section, index) {
      var children = [];
      var bodyChildren = [];
      if (section.heading) {
        children.push(el("h3", { class: "pb-extended-section-heading", text: section.heading }));
      }
      if (section.customVisual && visuals[section.customVisual]) {
        bodyChildren.push(el("figure", { class: "pb-extended-figure pb-extended-figure--custom" }, [
          visuals[section.customVisual]({ section: section, variant: "section" })
        ]));
      } else if (section.image) {
        bodyChildren.push(el("figure", { class: "pb-extended-figure" }, [
          el("img", { src: section.image, alt: "", loading: "lazy" })
        ]));
      }
      if (section.paragraphs && section.paragraphs.length) {
        section.paragraphs.forEach(function (p) {
          bodyChildren.push(el("p", { class: "pb-extended-paragraph", text: p }));
        });
      }
      if (section.table && section.table.rows && section.table.rows.length) {
        bodyChildren.push(view.renderTable(section.table));
      }
      if (section.callout) {
        bodyChildren.push(view.renderCallout(section.callout));
      }
      if (section.links && section.links.length) {
        bodyChildren.push(view.renderLinks(section.links));
      }

      if (section.collapsible) {
        children.push(el("details", { class: "pb-extended-collapsible" }, [
          el("summary", { class: "pb-extended-collapsible__summary" }, [
            el("span", { class: "pb-extended-collapsible__marker", text: "▸" }),
            el("span", { class: "pb-extended-collapsible__label", text: section.collapsible })
          ]),
          el("div", { class: "pb-extended-collapsible__body" }, bodyChildren)
        ]));
      } else {
        bodyChildren.forEach(function (child) { children.push(child); });
      }

      var wrap = el("section", { class: "pb-extended-section reveal" }, children);
      wrap.style.transitionDelay = Math.min(index * 90, 540) + "ms";
      return wrap;
    },

    renderTable: function (table) {
      var thead = table.headers ? el("thead", {}, [
        el("tr", {}, table.headers.map(function (h) {
          return el("th", { text: h });
        }))
      ]) : null;

      var tbody = el("tbody", {}, table.rows.map(function (row) {
        var cls = "pb-extended-row";
        if (row.tone === "positive") cls += " is-positive";
        else if (row.tone === "negative") cls += " is-negative";
        return el("tr", { class: cls }, row.cells.map(function (cell, i) {
          return el("td", {
            class: i === 0 ? "pb-extended-cell pb-extended-cell--lead" : "pb-extended-cell",
            text: cell
          });
        }));
      }));

      return el("div", { class: "pb-extended-table-wrap" }, [
        el("table", { class: "pb-extended-table" }, thead ? [thead, tbody] : [tbody])
      ]);
    },

    renderCallout: function (callout) {
      var cls = "pb-extended-callout";
      if (callout.tone === "positive") cls += " is-positive";
      else if (callout.tone === "negative") cls += " is-negative";
      return el("div", { class: cls }, [
        el("span", { class: "pb-extended-callout-mark", text: callout.tone === "negative" ? "⚠" : callout.tone === "positive" ? "✓" : "ⓘ" }),
        el("p", { class: "pb-extended-callout-text", text: callout.text })
      ]);
    },

    renderLinks: function (links) {
      return el("div", { class: "pb-extended-links" }, links.map(function (link) {
        return el("a", {
          class: "pb-extended-link",
          href: link.url,
          target: "_blank",
          rel: "noopener noreferrer"
        }, [
          el("span", { text: link.label }),
          el("span", { class: "pb-extended-link-arrow", text: "↗" })
        ]);
      }));
    },

    show: function () {
      TO.utils.observeReveals(document.getElementById("view-playbook"));
    }
  };

  function padNum(n) {
    var s = String(n);
    return s.length === 1 ? "0" + s : s;
  }

  function findLever(id) {
    var arr = TO.data.playbookLevers.levers;
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }

  TO.views = TO.views || {};
  TO.views.playbook = view;
})(window.TO = window.TO || {});
