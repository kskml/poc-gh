/* ============================================================
   Token-optimizer — main.css
   Sections: 1 Theme tokens · 2 Base · 3 Layout · 4 Components
   5 Header/Footer · 6 Hero · 7 Scenarios · 8 Diagram
   9 Calculator · 10 Playbook · 11 Extensibility · 12 Motion · 13 Responsive
   ============================================================ */

/* ---- 1 · Theme tokens -------------------------------------- */
:root {
  --bg: #0a0e1c;
  --bg-2: #0d1226;
  --surface: #141a31;
  --surface-2: #1b2240;
  --surface-3: #232c4f;
  --border: rgba(255,255,255,.08);
  --border-strong: rgba(255,255,255,.16);
  --text: #e9ecf8;
  --text-muted: #9aa4c6;
  --text-dim: #6b7399;
  --primary: #818cf8;
  --primary-bright: #a9b2ff;
  --cyan: #22d3ee;
  --green: #34d399;
  --amber: #fbbf24;
  --pink: #f472b6;
  --orange: #fb923c;
  --accent-grad: linear-gradient(135deg, #22d3ee 0%, #818cf8 100%);
  --shadow-sm: 0 2px 10px rgba(0,0,0,.28);
  --shadow-md: 0 14px 38px rgba(0,0,0,.42);
  --shadow-glow: 0 0 28px rgba(129,140,248,.32);
  --radius: 16px;
  --radius-sm: 10px;
  --maxw: 1180px;
  --ease: cubic-bezier(.22,.7,.28,1);
}
[data-theme="light"] {
  --bg: #eef1f9;
  --bg-2: #e7ebf6;
  --surface: #ffffff;
  --surface-2: #f5f7fd;
  --surface-3: #eaeef9;
  --border: rgba(24,31,58,.10);
  --border-strong: rgba(24,31,58,.18);
  --text: #182039;
  --text-muted: #51597b;
  --text-dim: #828bab;
  --primary: #5860d8;
  --primary-bright: #4148c4;
  --cyan: #0e9bb8;
  --green: #0f9d6e;
  --amber: #c98a05;
  --pink: #d8568f;
  --shadow-sm: 0 2px 10px rgba(30,40,80,.10);
  --shadow-md: 0 16px 40px rgba(30,40,80,.16);
  --shadow-glow: 0 0 26px rgba(88,96,216,.20);
}

/* ---- 2 · Base --------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(820px 460px at 78% -8%, rgba(34,211,238,.10), transparent 70%),
    radial-gradient(720px 520px at 12% 4%, rgba(129,140,248,.12), transparent 72%);
  pointer-events: none; z-index: 0;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
p { margin: 0; }
a { color: var(--primary-bright); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
::selection { background: rgba(129,140,248,.34); }

/* ---- 3 · Layout ------------------------------------------- */
.app-shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
.site-main { flex: 1; }
.container { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }
.container--narrow { max-width: 800px; }
.section { padding: 72px 0; }
.section--tight { padding: 30px 0; }
.section--alt { background: linear-gradient(180deg, transparent, var(--bg-2) 18% 82%, transparent); }
.view { display: none; }
.view--active { display: block; animation: viewIn .42s var(--ease); }

.section-head { max-width: 680px; margin-bottom: 38px; }
.eyebrow {
  display: inline-block; font-size: .76rem; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--cyan); margin-bottom: 12px;
}
.section-head h2 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
.section-lead { margin-top: 12px; color: var(--text-muted); font-size: 1.04rem; }

/* ---- 4 · Components --------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: .96rem;
  padding: 12px 22px; border-radius: 999px; border: 1px solid transparent;
  cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s var(--ease),
    background .2s, border-color .2s; white-space: nowrap;
}
.btn--sm { padding: 8px 16px; font-size: .86rem; }
.btn--primary { background: var(--accent-grad); color: #0a0e1c; box-shadow: var(--shadow-glow); }
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(129,140,248,.5); }
.btn--ghost { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.btn--ghost:hover { transform: translateY(-2px); border-color: var(--primary); background: var(--surface-3); }
.btn:active { transform: translateY(0); }

.eyebrow, .chip, .btn { -webkit-tap-highlight-color: transparent; }

.chip {
  font: inherit; font-size: .85rem; font-weight: 600;
  padding: 7px 15px; border-radius: 999px; cursor: pointer;
  background: var(--surface-2); color: var(--text-muted);
  border: 1px solid var(--border); transition: all .18s var(--ease);
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.is-active { background: var(--accent-grad); color: #0a0e1c; border-color: transparent; }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.reveal.is-visible { opacity: 1; transform: none; }

.detail-subhead {
  font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-dim); margin: 22px 0 10px;
}
.detail-subhead:first-child { margin-top: 0; }

/* ---- 5 · Header & Footer ---------------------------------- */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.header-inner { display: flex; align-items: center; gap: 16px; height: 66px; flex-wrap: nowrap; }
.site-header .brand {
  flex: none;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; flex: none; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 30px; height: 30px; }
.brand-name { font-size: 1.02rem; letter-spacing: -.02em; }
.brand-name strong { font-weight: 800; }
.brand-name span { color: var(--text-muted); font-weight: 600; }
[dir="rtl"] .site-header .brand { /* flex: none inherited */ }
@media (max-width: 900px) {
  .brand-name { display: none; }
}
.main-nav { display: flex; gap: 6px; margin-left: auto; align-items: center; flex-wrap: nowrap; }
.nav-link {
  color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: .92rem;
  padding: 8px 16px; border-radius: 999px; transition: color .18s, background .18s;
  white-space: nowrap; line-height: 1.2; display: inline-flex; align-items: center;
}
.nav-link:hover { color: var(--text); text-decoration: none; background: var(--surface-2); }
.nav-link.is-active { color: var(--text); background: var(--surface-2); }
.nav-link.is-active::after {
  content: ""; display: block; height: 2px; margin: 5px auto -2px; width: 18px;
  border-radius: 2px; background: var(--accent-grad);
}
.header-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.quick-guide-link {
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 600;
  font-size: .82rem;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  white-space: nowrap;
  line-height: 1.2;
  display: inline-flex;
  align-items: center;
  background: var(--surface-2);
  transition: color .18s, border-color .18s, background .18s;
}
.quick-guide-link:hover {
  color: var(--text);
  border-color: var(--primary);
  background: var(--surface-3);
  text-decoration: none;
}
.theme-toggle {
  width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); display: grid; place-items: center; transition: all .18s var(--ease);
}
.theme-toggle:hover { border-color: var(--primary); transform: rotate(18deg); }
.theme-icon { font-size: 1rem; grid-area: 1/1; transition: opacity .2s, transform .3s; }
[data-theme="dark"] .theme-icon--sun { opacity: 1; }
[data-theme="dark"] .theme-icon--moon { opacity: 0; transform: scale(.4) rotate(-40deg); }
[data-theme="light"] .theme-icon--sun { opacity: 0; transform: scale(.4) rotate(40deg); }
[data-theme="light"] .theme-icon--moon { opacity: 1; }

.nav-toggle { display: none; width: 40px; height: 40px; flex-direction: column; gap: 5px;
  justify-content: center; align-items: center; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
.nav-toggle span { width: 18px; height: 2px; background: var(--text); border-radius: 2px; transition: .2s; }

.site-footer { border-top: 1px solid var(--border); background: var(--bg-2); margin-top: 24px; }
.footer-inner { padding: 28px; display: flex; gap: 20px; flex-wrap: wrap;
  align-items: center; justify-content: space-between; }
.footer-note { color: var(--text-dim); font-size: .84rem; max-width: 760px; }
.footer-links { display: flex; gap: 16px; }
.footer-links a { font-size: .84rem; font-weight: 600; }
.footer-disclaimer { padding: 0 28px 28px; }
.footer-disclaimer-text { max-width: 100%; font-size: .78rem; line-height: 1.5; color: var(--text); opacity: 1; font-style: italic; }

/* ---- 6 · Hero --------------------------------------------- */
.hero { padding: 60px 0 30px; }
.hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; }
.hero-kicker {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--cyan); padding: 6px 14px; border-radius: 999px;
  background: color-mix(in srgb, var(--cyan) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--cyan) 30%, transparent); margin-bottom: 20px;
}
.hero-title { font-size: clamp(2.3rem, 5.4vw, 3.7rem); font-weight: 800; }
.hero-title-accent { background: var(--accent-grad); -webkit-background-clip: text;
  background-clip: text; color: transparent; }
.hero-sub { margin: 20px 0 28px; color: var(--text-muted); font-size: 1.1rem; max-width: 540px; }
.hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }

.hero-visual { display: flex; justify-content: center; }
.hero-pipeline { width: 100%; max-width: 480px; height: auto; overflow: hidden; }
.hero-lane { fill: none; stroke: var(--border-strong); stroke-width: 1.4; stroke-dasharray: 3 6; }
.hero-token--in { fill: var(--cyan); opacity: .6; }
.hero-token--out { fill: var(--primary-bright); filter: drop-shadow(0 0 5px rgba(129,140,248,.9)); }
.hero-core { fill: url(main.css); stroke: rgba(255,255,255,.5); stroke-width: 1.2; }
.hero-core-halo { fill: none; stroke: var(--cyan); stroke-width: 1.4;
  opacity: .4; transform-box: fill-box; transform-origin: center;
  animation: corePulse 3.4s var(--ease) infinite; }
.hero-core-label { fill: #0a0e1c; font-size: 11px; font-weight: 800; letter-spacing: .08em; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; transition: transform .25s var(--ease), border-color .25s;
}
.stat-card:hover { transform: translateY(-4px); border-color: var(--border-strong); }
.stat-value { font-size: 2.5rem; font-weight: 800; letter-spacing: -.03em;
  background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat-label { font-weight: 600; margin-top: 4px; }
.stat-note { color: var(--text-dim); font-size: .82rem; margin-top: 6px; }

.ttype-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.ttype-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; position: relative; overflow: hidden;
  transition: transform .25s var(--ease), border-color .25s; }
.ttype-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; }
.ttype-card[data-type="input"]::before { background: var(--cyan); }
.ttype-card[data-type="cached"]::before { background: var(--green); }
.ttype-card[data-type="output"]::before { background: var(--pink); }
.ttype-card:hover { transform: translateY(-4px); border-color: var(--border-strong); }
.ttype-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ttype-name { font-size: 1.2rem; font-weight: 700; }
.ttype-cost { font-size: .78rem; font-weight: 700; color: var(--text-dim);
  background: var(--surface-2); padding: 4px 10px; border-radius: 999px; }
.ttype-behavior { color: var(--text-muted); font-size: .92rem; margin: 12px 0 16px; }
.ttype-lever { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; }
.ttype-lever-tag { font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--cyan); border: 1px solid color-mix(in srgb, var(--cyan) 40%, transparent);
  padding: 2px 8px; border-radius: 6px; }

.feature-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.feature-card {
  text-align: left; font: inherit; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 26px; transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
}
.feature-card:hover { transform: translateY(-5px); border-color: var(--primary);
  box-shadow: var(--shadow-md); }
.feature-icon {
  width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
  font-size: 1.5rem; color: #0a0e1c; background: var(--accent-grad); margin-bottom: 16px;
}
.feature-card h3 { font-size: 1.2rem; }
.feature-card p { color: var(--text-muted); font-size: .94rem; margin: 8px 0 14px; }
.feature-go { color: var(--primary-bright); font-weight: 700; font-size: .9rem; }

/* ---- 7 · Scenarios ---------------------------------------- */
.sc-controls { display: flex; justify-content: space-between; gap: 18px;
  flex-wrap: wrap; align-items: flex-start; margin-bottom: 26px; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sc-search {
  font: inherit; font-size: .92rem; padding: 9px 16px; min-width: 220px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  color: var(--text); transition: border-color .18s;
}
.sc-search:focus { outline: none; border-color: var(--primary); }
.sc-search::placeholder { color: var(--text-dim); }

.scenario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }
.scenario-card {
  display: flex; flex-direction: column; cursor: pointer; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; transition: transform .24s var(--ease), border-color .24s, box-shadow .24s;
}
.scenario-card:hover { transform: translateY(-5px); border-color: var(--primary);
  box-shadow: var(--shadow-md); }
.sc-card-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sc-cat {
  font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--cyan); background: color-mix(in srgb, var(--cyan) 12%, transparent);
  padding: 4px 10px; border-radius: 6px;
}
.sc-impact-pill { font-size: .74rem; font-weight: 700; color: var(--green); text-align: right; }
.sc-title { font-size: 1.16rem; margin: 14px 0 8px; }
.sc-tagline { color: var(--text-muted); font-size: .92rem; flex: 1; }
.sc-card-foot { display: flex; justify-content: space-between; align-items: center;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.sc-source { font-size: .76rem; color: var(--text-dim); }
.sc-open { font-size: .82rem; font-weight: 700; color: var(--primary-bright); }
.empty-note { color: var(--text-dim); padding: 40px; text-align: center; }

.scenario-detail { display: none; }
.scenario-detail.is-open { display: block; animation: viewIn .4s var(--ease); }
.detail-bar { display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 22px; gap: 16px; }
.detail-source { font-size: .8rem; color: var(--text-dim); font-weight: 600; }
.detail-head { margin-bottom: 26px; }
.detail-title { font-size: clamp(1.6rem, 3.6vw, 2.3rem); margin: 12px 0 8px; }
.detail-tagline { color: var(--text-muted); font-size: 1.06rem; }
.detail-grid { display: grid; grid-template-columns: 1fr 360px; gap: 26px; align-items: start; }
.detail-main { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px; }
.detail-text { color: var(--text-muted); }
.detail-side { display: flex; flex-direction: column; gap: 16px; }
.detail-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px; }
.detail-card--accent { background: linear-gradient(150deg,
  color-mix(in srgb, var(--primary) 18%, var(--surface)), var(--surface)); }
.detail-takeaway { font-size: 1rem; font-weight: 600; color: var(--text); }

.why-list { margin: 0; padding-left: 20px; color: var(--text-muted); }
.why-list li { margin: 6px 0; }
.technique-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.technique-item { background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px; }
.technique-name { display: block; font-weight: 700; color: var(--cyan); font-size: .92rem; }
.technique-detail { display: block; color: var(--text-muted); font-size: .9rem; margin-top: 3px; }

.detail-pillars { display: flex; flex-wrap: wrap; gap: 8px; }
.pillar-tag { font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
  padding: 6px 12px; border-radius: 999px; transition: all .18s; }
.pillar-tag:hover { border-color: var(--primary); color: var(--primary-bright); }

.impact-chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.imp-metric { font-size: .82rem; color: var(--text-dim); font-weight: 600; }
.imp-reduction { font-size: 1.5rem; font-weight: 800; color: var(--green); }
.imp-row { display: grid; grid-template-columns: 54px 1fr; gap: 8px;
  align-items: center; margin-bottom: 10px; }
.imp-bar-label { font-size: .8rem; color: var(--text-dim); font-weight: 600; }
.imp-bar-track { background: var(--surface-2); border-radius: 6px; height: 26px;
  overflow: hidden; position: relative; }
.imp-bar-fill { height: 100%; border-radius: 6px; transition: width 1s var(--ease); min-width: 3px; }
.imp-bar-fill--before { background: linear-gradient(90deg, #5b6488, #7a85ad); }
.imp-bar-fill--after { background: var(--accent-grad); }
.imp-bar-value { grid-column: 2; font-size: .78rem; color: var(--text-muted); margin-top: -4px; }

.ex-block { margin-top: 22px; }
.ex-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ex-col { border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--border); }
.ex-col--before { background: color-mix(in srgb, #f87171 9%, var(--surface-2)); }
.ex-col--after { background: color-mix(in srgb, var(--green) 10%, var(--surface-2)); }
.ex-tag { font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.ex-col--before .ex-tag { color: #f87171; }

/* ---- Modal / popup ----------------------------------------- */
.modal-overlay { position: fixed; inset: 0; z-index: 1000;

/* Scenario grid rendered inside a modal — single column, denser */

/* ---- 10 · Playbook ---------------------------------------- */

/* 10a · Lever grid (token-optimization levers) ----------- */
.pb-lever-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 22px;
  transition: opacity .35s var(--ease), transform .35s var(--ease);
}
.pb-lever-grid.is-hidden {
  display: none;
}
.pb-lever-card {
  --lever-color: var(--primary);
  position: relative;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  text-align: left;
  font: inherit;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  padding: 0;
  transition: transform .26s var(--ease), border-color .26s, box-shadow .26s;
}
.pb-lever-card::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--lever-color);
  opacity: .9;
  transition: height .26s var(--ease), opacity .26s;
}
.pb-lever-card:hover,
.pb-lever-card:focus-visible {
  transform: translateY(-6px);
  border-color: color-mix(in srgb, var(--lever-color) 55%, var(--border));
  box-shadow: 0 18px 48px color-mix(in srgb, var(--lever-color) 22%, transparent);
}
.pb-lever-card:hover::before,
.pb-lever-card:focus-visible::before {
  height: 6px;
}
.pb-lever-image-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--surface-2);
  overflow: hidden;
}
.pb-lever-image-wrap::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, color-mix(in srgb, var(--surface) 80%, transparent) 100%);
  pointer-events: none;
}
.pb-lever-image {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
  transition: transform .8s var(--ease);
}
.pb-lever-card:hover .pb-lever-image {
  transform: scale(1.05);
}
.pb-lever-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px 22px 22px;
  flex: 1;
}
.pb-lever-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.pb-lever-num {
  flex: none;
  width: 40px; height: 40px;
  border-radius: 12px;
  display: grid; place-items: center;
  font-weight: 800; font-size: 1rem;
  color: #0a0e1c;
  background: linear-gradient(135deg, var(--lever-color), color-mix(in srgb, var(--lever-color) 50%, #fff));
  box-shadow: 0 6px 18px color-mix(in srgb, var(--lever-color) 35%, transparent);
}
.pb-lever-name {
  font-size: 1.15rem;
  line-height: 1.25;
}
.pb-lever-tagline {
  font-weight: 600;
  color: var(--lever-color);
  font-size: .92rem;
  letter-spacing: -.005em;
}
.pb-lever-summary {
  color: var(--text-muted);
  font-size: .92rem;
  flex: 1;
}
.pb-lever-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 4px;
  padding: 12px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
}
.pb-lever-stat {
  display: flex;
  flex-direction: column;
}
.pb-lever-stat-value {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--lever-color);
  letter-spacing: -.02em;
}
.pb-lever-stat-label {
  font-size: .72rem;
  color: var(--text-dim);
  font-weight: 600;
}
.pb-lever-cta {
  display: inline-flex;
  align-items: center;
  font-weight: 700;
  font-size: .86rem;
  color: var(--lever-color);
  margin-top: 6px;
  letter-spacing: .01em;
}

/* 10b · Lever extended (deep-dive panel) ----------------- */
.pb-lever-detail {
  display: none;
}
.pb-lever-detail.is-open {
  display: block;
  animation: viewIn .42s var(--ease);
}
.pb-lever-extended {
  --lever-color: var(--primary);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  position: relative;
}
.pb-lever-extended::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--lever-color);
  border-top-left-radius: var(--radius);
  border-top-right-radius: var(--radius);
}
.pb-extended-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
  gap: 16px;
  flex-wrap: wrap;
}
.pb-extended-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pb-extended-back-mark {
  font-weight: 800;
}
.pb-extended-counter {
  font-size: .78rem;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.pb-extended-head {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 26px;
  align-items: center;
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.pb-extended-head-text {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pb-extended-num {
  display: inline-block;
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--lever-color);
  padding: 4px 12px;
  border: 1px solid color-mix(in srgb, var(--lever-color) 40%, transparent);
  background: color-mix(in srgb, var(--lever-color) 10%, transparent);
  border-radius: 999px;
  width: max-content;
}
.pb-extended-title {
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
}
.pb-extended-tagline {
  color: var(--lever-color);
  font-weight: 700;
  font-size: 1.04rem;
}
.pb-extended-summary {
  color: var(--text-muted);
  font-size: 1rem;
}
.pb-extended-hero {
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.pb-extended-hero img {
  width: 100%; height: auto; display: block;
}

/* Scrollable sections column */
.pb-extended-sections {
  display: flex;
  flex-direction: column;
  gap: 26px;
  max-height: none;
}
.pb-extended-section {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--lever-color);
  border-radius: var(--radius-sm);
  padding: 22px 24px;
}
.pb-extended-section-heading {
  font-size: 1.1rem;
  margin-bottom: 12px;
  color: var(--text);
}
.pb-extended-paragraph {
  color: var(--text-muted);
  font-size: .96rem;
  line-height: 1.65;
  margin-bottom: 10px;
}
.pb-extended-paragraph:last-child { margin-bottom: 0; }
.pb-extended-figure {
  margin: 4px 0 16px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
}
.pb-extended-figure img {
  width: 100%; height: auto; display: block;
}

/* Tables — positive / negative tone */
.pb-extended-table-wrap {
  overflow-x: auto;
  margin: 14px 0 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.pb-extended-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}
.pb-extended-table thead {
  background: var(--surface);
}
.pb-extended-table th {
  text-align: left;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.pb-extended-cell {
  padding: 12px 14px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.pb-extended-cell--lead {
  color: var(--text);
  font-weight: 700;
  white-space: nowrap;
}
.pb-extended-row:last-child .pb-extended-cell { border-bottom: none; }
.pb-extended-row.is-positive {
  background: color-mix(in srgb, var(--green) 10%, transparent);
}
.pb-extended-row.is-positive .pb-extended-cell--lead {
  color: var(--green);
}
.pb-extended-row.is-positive .pb-extended-cell:first-child {
  border-left: 3px solid var(--green);
}
.pb-extended-row.is-negative {
  background: color-mix(in srgb, var(--orange) 12%, transparent);
}
.pb-extended-row.is-negative .pb-extended-cell--lead {
  color: var(--orange);
}
.pb-extended-row.is-negative .pb-extended-cell:first-child {
  border-left: 3px solid var(--orange);
}

/* Callouts */
.pb-extended-callout {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin: 14px 0 4px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--text-dim);
  border-radius: var(--radius-sm);
}
.pb-extended-callout.is-positive {
  border-left-color: var(--green);
  background: color-mix(in srgb, var(--green) 8%, var(--surface));
}
.pb-extended-callout.is-negative {
  border-left-color: var(--orange);
  background: color-mix(in srgb, var(--orange) 10%, var(--surface));
}
.pb-extended-callout-mark {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 50%;
  font-weight: 800;
  font-size: .9rem;
  background: var(--surface-2);
  color: var(--text-dim);
}
.pb-extended-callout.is-positive .pb-extended-callout-mark {
  background: color-mix(in srgb, var(--green) 24%, transparent);
  color: var(--green);
}
.pb-extended-callout.is-negative .pb-extended-callout-mark {
  background: color-mix(in srgb, var(--orange) 28%, transparent);
  color: var(--orange);
}
.pb-extended-callout-text {
  color: var(--text);
  font-size: .94rem;
  line-height: 1.55;
}

/* External links */
.pb-extended-links {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 14px;
}
.pb-extended-link {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
  transition: all .2s var(--ease);
}
.pb-extended-link:hover {
  border-color: var(--lever-color);
  transform: translateX(4px);
  text-decoration: none;
}
.pb-extended-link-arrow {
  color: var(--lever-color);
  font-weight: 800;
  font-size: 1rem;
}

.pb-extended-foot {
  margin-top: 28px;
  display: flex;
  justify-content: center;
}

/* 10b-i · Custom visuals (image-free, flow-driven animations) ----- */

/* Shared chip — used by every custom visual in lever 1. */
.pbv { color: var(--text); }
.pbv-chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 9px;
  border-radius: 999px;
  font: 600 .78rem/1 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  letter-spacing: -.01em;
  white-space: nowrap;
  border: 1px solid transparent;
  transform-origin: center;
  will-change: opacity, transform, max-width;
}
.pbv-chip--keep {
  background: color-mix(in srgb, var(--lever-color) 18%, transparent);
  border-color: color-mix(in srgb, var(--lever-color) 55%, transparent);
  color: color-mix(in srgb, var(--lever-color) 92%, #fff);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--lever-color) 22%, transparent);
}
.pbv-chip--filler {
  background: color-mix(in srgb, var(--text-dim, #94a3b8) 14%, transparent);
  border-color: color-mix(in srgb, var(--text-dim, #94a3b8) 28%, transparent);
  color: var(--text-muted, #cbd5e1);
  max-width: 220px;
  overflow: hidden;
  animation: pbvFillerVanish 7s var(--ease) infinite;
}
.pbv-chip--arrow {
  background: transparent;
  border-color: transparent;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff);
  padding: 4px 4px;
  font-weight: 800;
}

/* Looping vanish — filler chips collapse to zero width, then return. */
@keyframes pbvFillerVanish {
  0%, 12%   { opacity: 1; max-width: 220px;
              padding-inline: 9px; margin-inline: 0;
              transform: translateY(0) scale(1); filter: none; }
  28%, 70%  { opacity: 0; max-width: 0;
              padding-inline: 0; margin-inline: -2px;
              transform: translateY(-4px) scale(.86); filter: blur(1px); }
  86%, 100% { opacity: 1; max-width: 220px;
              padding-inline: 9px; margin-inline: 0;
              transform: translateY(0) scale(1); filter: none; }
}

/* --- Tile variant (lives inside .pb-lever-image-wrap, 16:9) --- */
.pb-lever-image-wrap--custom { background: linear-gradient(160deg,
  color-mix(in srgb, var(--lever-color) 10%, var(--surface-2)) 0%,
  var(--surface-2) 60%); }
.pb-lever-image-wrap--custom::after {
  background: linear-gradient(180deg, transparent 70%,
    color-mix(in srgb, var(--surface) 90%, transparent) 100%);
}

.pbv--compression-tile {
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  gap: 8px;
  padding: 14px 16px 16px;
  font-size: .85rem;
}
.pbv--compression-tile::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 80% at 100% 0%, color-mix(in srgb, var(--lever-color) 16%, transparent), transparent 60%),
    radial-gradient(40% 60% at 0% 100%, color-mix(in srgb, var(--lever-color) 10%, transparent), transparent 70%);
  pointer-events: none;
}
.pbv__row {
  position: relative;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  font-size: .68rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-dim);
  font-weight: 700;
}
.pbv__label--after { color: color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv__count {
  font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  letter-spacing: -.01em;
  padding: 3px 7px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--text-dim) 14%, transparent);
  color: var(--text);
}
.pbv__count--before { animation: pbvCountFade 7s var(--ease) infinite; }
.pbv__count--after {
  background: color-mix(in srgb, var(--lever-color) 22%, transparent);
  color: color-mix(in srgb, var(--lever-color) 92%, #fff);
  border: 1px solid color-mix(in srgb, var(--lever-color) 45%, transparent);
  opacity: 0;
  animation: pbvCountIn 7s var(--ease) infinite;
}
@keyframes pbvCountFade {
  0%, 18% { opacity: 1; transform: scale(1); }
  35%, 70% { opacity: .35; transform: scale(.92); }
  86%, 100% { opacity: 1; transform: scale(1); }
}
@keyframes pbvCountIn {
  0%, 22% { opacity: 0; transform: translateY(4px) scale(.9); }
  40%, 78% { opacity: 1; transform: translateY(0) scale(1); }
  92%, 100% { opacity: 0; transform: translateY(4px) scale(.9); }
}

.pbv__phrase {
  position: relative;
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px 5px;
  align-content: center;
}

.pbv__meter {
  position: relative;
  display: flex; align-items: center; gap: 10px;
}
.pbv__meter-bar {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 18%, transparent);
  overflow: hidden;
  position: relative;
}
.pbv__meter-fill {
  display: block; height: 100%;
  width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--lever-color) 80%, #fff),
    var(--lever-color));
  box-shadow: 0 0 12px color-mix(in srgb, var(--lever-color) 50%, transparent);
  transform-origin: left center;
  animation: pbvMeterShrink 7s var(--ease) infinite;
}
@keyframes pbvMeterShrink {
  0%, 18%  { transform: scaleX(1); }
  45%, 70% { transform: scaleX(.25); }
  86%, 100% { transform: scaleX(1); }
}
.pbv__save {
  font: 800 .72rem/1 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 92%, #fff);
  padding: 3px 7px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--lever-color) 20%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 50%, transparent);
  opacity: 0;
  animation: pbvCountIn 7s var(--ease) infinite;
}

/* --- Hero variant (lives inside .pb-extended-hero, larger area) --- */
.pb-extended-hero--custom {
  background: linear-gradient(155deg,
    color-mix(in srgb, var(--lever-color) 8%, var(--surface)) 0%,
    var(--surface-2) 70%);
  padding: 22px 24px;
  position: relative;
}
.pbv--compression-hero {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr 1fr 1fr;
  gap: 14px;
  min-height: 340px;
}
.pbv-hero__title { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.pbv-hero__title-eyebrow {
  font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff);
}
.pbv-hero__title-headline {
  font-size: 1.08rem; font-weight: 700; color: var(--text);
  letter-spacing: -.01em;
}
.pbv-hero__row {
  display: grid;
  grid-template-columns: 130px 1fr;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 18%, var(--border));
  opacity: 0;
  transform: translateX(-8px);
  animation: pbvHeroRowIn .6s var(--ease) forwards;
}
@keyframes pbvHeroRowIn {
  to { opacity: 1; transform: translateX(0); }
}
.pbv-hero__row--full  { border-color: color-mix(in srgb, var(--lever-color) 32%, var(--border)); }
.pbv-hero__row--ultra {
  border-color: color-mix(in srgb, var(--lever-color) 52%, var(--border));
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--lever-color) 12%, var(--surface)),
    color-mix(in srgb, var(--surface) 80%, transparent) 70%);
}
.pbv-hero__meta { display: flex; flex-direction: column; gap: 2px; }
.pbv-hero__level {
  font-weight: 800; font-size: .98rem;
  color: var(--text);
  letter-spacing: -.01em;
}
.pbv-hero__savings {
  font: 700 .72rem/1.2 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 85%, #fff);
}
.pbv-hero__phrase {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
}
.pbv-hero__pulse {
  position: absolute;
  top: 16px; right: 18px;
  display: flex; flex-direction: column; align-items: center;
  width: 72px; height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%,
    color-mix(in srgb, var(--lever-color) 30%, transparent),
    transparent 65%),
    color-mix(in srgb, var(--lever-color) 20%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--lever-color) 55%, transparent);
  justify-content: center;
  animation: pbvHeroPulse 2.6s var(--ease) infinite;
}
@keyframes pbvHeroPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--lever-color) 35%, transparent); }
  50%      { transform: scale(1.05); box-shadow: 0 0 0 10px color-mix(in srgb, var(--lever-color) 0%, transparent); }
}
.pbv-hero__pulse-num {
  font-weight: 900; font-size: 1.05rem;
  color: color-mix(in srgb, var(--lever-color) 95%, #fff);
  letter-spacing: -.02em;
}
.pbv-hero__pulse-label {
  font-size: .58rem; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-muted);
  font-weight: 700;
}

/* --- Structured-input section visual (replaces image3) --- */
.pb-extended-figure--custom { background: transparent; border: 0; padding: 0; }
.pbv--structured {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 14px;
  align-items: stretch;
  padding: 8px 0;
}
.pbv-struct__pane {
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  min-height: 170px;
}
.pbv-struct__pane--structured {
  border-color: color-mix(in srgb, var(--lever-color) 45%, var(--border));
  background: linear-gradient(160deg,
    color-mix(in srgb, var(--lever-color) 10%, var(--surface)) 0%,
    var(--surface) 70%);
}
.pbv-struct__pane-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.pbv-struct__pane-label {
  font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-dim);
}
.pbv-struct__pane--structured .pbv-struct__pane-label {
  color: color-mix(in srgb, var(--lever-color) 85%, #fff);
}
.pbv-struct__pane-count {
  font: 800 .8rem/1 var(--font-mono, ui-monospace, monospace);
  padding: 4px 8px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--text-dim) 14%, transparent);
  color: var(--text);
}
.pbv-struct__pane--structured .pbv-struct__pane-count {
  background: color-mix(in srgb, var(--lever-color) 20%, transparent);
  color: color-mix(in srgb, var(--lever-color) 92%, #fff);
  border: 1px solid color-mix(in srgb, var(--lever-color) 45%, transparent);
}
.pbv-struct__prose {
  flex: 1;
  margin: 0;
  font-size: .9rem; line-height: 1.6;
  color: var(--text-muted);
  animation: pbvProsePulse 5s var(--ease) infinite;
}
@keyframes pbvProsePulse {
  0%, 30%, 100% { opacity: 1; }
  55%, 80%      { opacity: .35; }
}
.pbv-struct__code {
  flex: 1;
  margin: 0;
  font: 600 .82rem/1.55 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  color: var(--text);
  display: flex; flex-direction: column;
  white-space: pre;
  overflow-x: auto;
}
.pbv-struct__line {
  display: block;
  opacity: 0;
  transform: translateX(-6px);
  animation: pbvLineIn 5s var(--ease) infinite;
}
.pbv-struct__line:nth-child(1) { animation-delay: .25s; }
.pbv-struct__line:nth-child(2) { animation-delay: .55s; }
.pbv-struct__line:nth-child(3) { animation-delay: .85s; }
.pbv-struct__line:nth-child(4) { animation-delay: 1.15s; }
@keyframes pbvLineIn {
  0%, 10%       { opacity: 0; transform: translateX(-6px); }
  25%, 80%      { opacity: 1; transform: translateX(0); }
  95%, 100%     { opacity: 0; transform: translateX(-6px); }
}
.pbv-struct__bar {
  height: 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 18%, transparent);
  overflow: hidden;
}
.pbv-struct__bar-fill {
  display: block; height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--lever-color) 80%, #fff),
    var(--lever-color));
  transform-origin: left center;
}
.pbv-struct__bar-fill--prose      { width: 100%; opacity: .55; }
.pbv-struct__bar-fill--structured { width: 64%; }
.pbv-struct__arrow {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  padding: 0 4px;
  color: color-mix(in srgb, var(--lever-color) 85%, #fff);
}
.pbv-struct__arrow-mark {
  font-size: 1.6rem; font-weight: 800;
  animation: pbvArrowSlide 2.2s var(--ease) infinite;
}
@keyframes pbvArrowSlide {
  0%, 100% { transform: translateX(0); opacity: .85; }
  50%      { transform: translateX(4px); opacity: 1; }
}
.pbv-struct__arrow-label {
  font: 700 .65rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--text-dim);
}
@media (max-width: 720px) {
  .pbv--structured { grid-template-columns: 1fr; }
  .pbv-struct__arrow { flex-direction: row; gap: 10px; }
  .pbv-struct__arrow-mark { transform: rotate(90deg); }
}

/* =========================================================================
   10b-ii · Custom visuals for levers 2–10
   ========================================================================= */

/* --- Generic reveal for rows that set animation-delay inline --- */
@keyframes pbvRowSlide {
  0%, 8%   { opacity: 0; transform: translateX(-10px); }
  22%, 78% { opacity: 1; transform: translateX(0); }
  92%, 100%{ opacity: 0; transform: translateX(-10px); }
}
@keyframes pbvRowIn {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes pbvRowFade {
  0%, 8%   { opacity: 0; transform: translateY(6px); }
  22%, 80% { opacity: 1; transform: translateY(0); }
  94%, 100%{ opacity: 0; transform: translateY(6px); }
}
@keyframes pbvBarGrow {
  0%, 12%  { transform: scaleX(0); }
  35%, 80% { transform: scaleX(1); }
  95%, 100%{ transform: scaleX(0); }
}

/* =========================================================================
   LEVER 2 · Choose the right language
   ========================================================================= */
.pbv--language-tile { position: absolute; inset: 0; display: grid;
  grid-template-rows: auto 1fr; gap: 10px; padding: 14px 16px 16px; }
.pbv-lang__head { display: flex; justify-content: space-between; align-items: center; }
.pbv-lang__title { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
.pbv-lang__pin { font: 700 .65rem/1 var(--font-mono, ui-monospace, monospace);
  padding: 4px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--lever-color) 20%, transparent);
  color: color-mix(in srgb, var(--lever-color) 92%, #fff);
  border: 1px solid color-mix(in srgb, var(--lever-color) 45%, transparent);
}
.pbv-lang__list { display: grid; grid-template-rows: repeat(4, 1fr); gap: 6px; align-content: stretch; }
.pbv-lang__row { display: grid; grid-template-columns: 28px 70px 1fr 52px; align-items: center;
  gap: 10px; padding: 4px 6px; border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 60%, transparent);
  opacity: 0; animation: pbvRowSlide 6s var(--ease) infinite; }
.pbv-lang__code { font: 800 .75rem/1 var(--font-mono, ui-monospace, monospace);
  color: var(--text); letter-spacing: -.01em; }
.pbv-lang__name { font-size: .82rem; color: var(--text-muted); }
.pbv-lang__bar { display: block; height: 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 15%, transparent); overflow: hidden; }
.pbv-lang__fill { display: block; height: 100%; width: var(--w, 0%);
  border-radius: inherit;
  background: linear-gradient(90deg, color-mix(in srgb, var(--lever-color) 80%, #fff), var(--lever-color));
  transform-origin: left center; animation: pbvBarGrow 6s var(--ease) infinite; }
.pbv-lang__bar--best  .pbv-lang__fill { background: linear-gradient(90deg, #5eead4, #34d399); }
.pbv-lang__bar--warn  .pbv-lang__fill { background: linear-gradient(90deg, #fde68a, #fbbf24); }
.pbv-lang__bar--bad   .pbv-lang__fill { background: linear-gradient(90deg, #fca5a5, #f87171); }
.pbv-lang__ratio { text-align: right;
  font: 800 .8rem/1 var(--font-mono, ui-monospace, monospace); color: var(--text); }

/* Lever 2 hero: heatmap */
.pbv--language-hero { position: relative; display: grid;
  grid-template-rows: auto 1fr auto; gap: 14px; min-height: 340px; }
.pbv-heat__title { display: flex; flex-direction: column; gap: 4px; }
.pbv-heat__eyebrow { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-heat__headline { font-size: 1.08rem; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
.pbv-heat__grid { display: grid; grid-template-columns: 70px repeat(9, 1fr); gap: 4px; align-items: center; }
.pbv-heat__corner { /* empty */ }
.pbv-heat__head { text-align: center;
  font: 700 .7rem/1 var(--font-mono, ui-monospace, monospace);
  color: var(--text-dim); padding: 4px 0; letter-spacing: .04em; }
.pbv-heat__head.is-best { color: color-mix(in srgb, #34d399 80%, #fff);
  background: color-mix(in srgb, #34d399 18%, transparent);
  border-radius: 6px; }
.pbv-heat__row-label { font-size: .78rem; font-weight: 600; color: var(--text-muted); padding-right: 6px; }
.pbv-heat__cell { display: flex; align-items: center; justify-content: center;
  height: 30px; border-radius: 6px;
  font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  color: var(--text);
  background: color-mix(in srgb, #34d399 calc(20% - var(--heat, 0) * 18%), transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 12%, transparent);
  opacity: 0; animation: pbvRowFade 6s var(--ease) infinite; }
.pbv-heat__cell { /* tint by heat */
  background: linear-gradient(0deg,
    color-mix(in srgb, #f87171 calc(var(--heat, 0) * 55%), transparent),
    color-mix(in srgb, #f87171 calc(var(--heat, 0) * 55%), transparent)),
    color-mix(in srgb, #34d399 calc((1 - var(--heat, 0)) * 28%), transparent);
}
.pbv-heat__legend { display: flex; align-items: center; gap: 10px; }
.pbv-heat__legend-label { font: 700 .65rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim); }
.pbv-heat__legend-bar { flex: 1; height: 8px; border-radius: 999px;
  background: linear-gradient(90deg, #34d399, #fbbf24, #f87171); }
@media (max-width: 720px) {
  .pbv-heat__grid { grid-template-columns: 50px repeat(9, 1fr); }
  .pbv-heat__cell { font-size: .6rem; height: 24px; }
}

/* =========================================================================
   LEVER 3 · Manage your context
   ========================================================================= */
.pbv--context-tile { position: absolute; inset: 0; display: grid;
  grid-template-rows: auto 1fr; gap: 10px; padding: 14px 16px 16px; }
.pbv-ctx__head { display: flex; justify-content: space-between; align-items: center; }
.pbv-ctx__title { font: 700 .78rem/1 var(--font-mono, ui-monospace, monospace);
  color: var(--text); letter-spacing: -.01em; }
.pbv-ctx__cache { display: inline-flex; align-items: center; gap: 6px;
  font: 700 .65rem/1 var(--font-mono, ui-monospace, monospace);
  padding: 4px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--lever-color) 18%, transparent);
  color: color-mix(in srgb, var(--lever-color) 92%, #fff);
  border: 1px solid color-mix(in srgb, var(--lever-color) 45%, transparent); }
.pbv-ctx__cache-dot { width: 7px; height: 7px; border-radius: 50%;
  background: color-mix(in srgb, var(--lever-color) 85%, #fff);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--lever-color) 50%, transparent);
  animation: pbvHeroPulse 2.4s var(--ease) infinite; }
.pbv-ctx__stack { display: grid; grid-template-rows: repeat(3, 1fr); gap: 6px; align-content: stretch; }
.pbv-ctx__layer { display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 22%, var(--border));
  opacity: 0; animation: pbvRowSlide 6s var(--ease) infinite; }
.pbv-ctx__layer--always { border-left: 3px solid color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-ctx__layer--cond   { border-left: 3px solid color-mix(in srgb, var(--lever-color) 55%, #fff); }
.pbv-ctx__layer--demand { border-left: 3px solid color-mix(in srgb, var(--lever-color) 35%, #fff); }
.pbv-ctx__layer-name { font-weight: 700; font-size: .85rem; color: var(--text); }
.pbv-ctx__layer-when { font: 600 .7rem/1 var(--font-mono, ui-monospace, monospace);
  color: var(--text-dim); }

/* =========================================================================
   LEVER 11 · Power user guidance
   ========================================================================= */
.pbv--power-tile {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 0.95fr 1.2fr;
  gap: 10px;
  padding: 14px 16px 16px;
  background: linear-gradient(140deg, #09110f 0%, #07100d 100%);
}
.pbv-pu__left {
  display: flex;
  flex-direction: column;
  justify-content: space-between;

  padding-right: 10px;
}
.pbv-pu__kicker {
  font: 700 .68rem/1 var(--font-mono, ui-monospace, monospace);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #9ca6b5;
}
.pbv-pu__title {
  font-size: 1.55rem;
  line-height: 1.02;
  font-weight: 700;
  color: #f1f5f9;
  letter-spacing: -.02em;
}
.pbv-pu__right {
  display: grid;
  align-content: center;
  gap: 8px;
}
.pbv-pu__tip {
  padding: 10px 11px;
  border-radius: 8px;
  border: 1px solid #1f2f2a;
  background: #0b1612;

}

.pbv--power-hero {
  min-height: 360px;
}
.pbv-puh__panel {
  display: grid;
  grid-template-columns: 0.9fr 1.3fr;
  gap: 0;
  border: 1px solid #20332d;

  background: #08110d;
}
.pbv-puh__left {
  padding: 18px 16px;
  border-right: 2px solid color-mix(in srgb, var(--lever-color) 60%, transparent);

  flex-direction: column;
  gap: 14px;
}
.pbv-puh__left-kicker {
  font: 700 .68rem/1 var(--font-mono, ui-monospace, monospace);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #9ca6b5;
}
.pbv-puh__left-title {
  font-size: clamp(1.65rem, 2.8vw, 3rem);
  line-height: .95;
  font-weight: 700;
  color: #f8fafc;
  letter-spacing: -.03em;
}
.pbv-puh__left-note {
  margin-top: auto;
  font-size: .86rem;
  line-height: 1.45;
  color: #c6d0db;
}
.pbv-puh__right {
  display: grid;
  background: #08100c;
}
.pbv-puh__row {
  padding: 12px 16px;
  border-bottom: 1px solid #20332d;
  opacity: 0;
  animation: pbvRowIn .45s var(--ease) forwards;
}

  border-bottom: 0;
}

  font-weight: 700;

  letter-spacing: -.01em;
}

  font-size: .84rem;
  line-height: 1.35;
  color: #b8c3d2;
}
.pbv-puh__row-link {
  display: inline-block;
  margin-top: 4px;
  font-size: .78rem;
  color: color-mix(in srgb, var(--lever-color) 95%, #fff);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.pbv-puh__row-link:hover {
  color: #fff;
}
@media (max-width: 900px) {
  .pbv--power-tile {
    grid-template-columns: 1fr;
  }
  .pbv-pu__left {
    border-right: 0;
    border-bottom: 1px solid #20332d;
    padding-right: 0;
    padding-bottom: 10px;
  }
  .pbv-puh__panel {
    grid-template-columns: 1fr;
  }
  .pbv-puh__left {
    border-right: 0;
    border-bottom: 2px solid color-mix(in srgb, var(--lever-color) 60%, transparent);
  }
}

/* Lever 3 hero */
.pbv--context-hero { position: relative; display: grid; gap: 12px; min-height: 340px;
  grid-template-rows: auto auto 1fr 1fr 1fr; }
.pbv-ctx-hero__title { display: flex; flex-direction: column; gap: 4px; }
.pbv-ctx-hero__eyebrow { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-ctx-hero__headline { font-size: 1.08rem; font-weight: 700; color: var(--text); }
.pbv-ctx-hero__cache-band { display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border-radius: var(--radius-sm);

.pbv-ctx-hero__cache-label { font-weight: 700; color: color-mix(in srgb, var(--lever-color) 92%, #fff); }
.pbv-ctx-hero__cache-cost { font: 800 .85rem/1 var(--font-mono, ui-monospace, monospace);

  background: color-mix(in srgb, var(--lever-color) 20%, transparent); }
.pbv-ctx-hero__layer { display: grid; grid-template-columns: 1fr auto; align-items: center;
  gap: 12px; padding: 12px 16px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 75%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 25%, var(--border));
  opacity: 0; animation: pbvHeroRowIn .6s var(--ease) forwards; }
.pbv-ctx-hero__layer--always { border-left: 4px solid color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-ctx-hero__layer--cond   { border-left: 4px solid color-mix(in srgb, var(--lever-color) 55%, #fff); }
.pbv-ctx-hero__layer--demand { border-left: 4px solid color-mix(in srgb, var(--lever-color) 35%, #fff); }
.pbv-ctx-hero__layer-head { display: flex; flex-direction: column; gap: 2px; }
.pbv-ctx-hero__layer-name { font-weight: 800; color: var(--text); font-size: .98rem; }
.pbv-ctx-hero__layer-when { font: 700 .72rem/1.2 var(--font-mono, ui-monospace, monospace);

/* Lever 3 token-loop section */
.pbv--token-loop { display: grid; gap: 8px; padding: 8px 0; }
.pbv-loop__title { font: 700 .8rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin-bottom: 4px; }
.pbv-loop__row { display: grid; grid-template-columns: 80px 1fr 110px; align-items: center;
  gap: 12px; padding: 6px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 65%, transparent);
  opacity: 0; animation: pbvRowSlide 6s var(--ease) infinite; }
.pbv-loop__num { font: 800 .82rem/1 var(--font-mono, ui-monospace, monospace); color: var(--text); }
.pbv-loop__bar { display: block; height: 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 14%, transparent); overflow: hidden; }
.pbv-loop__bar-fill { display: block; height: 100%; width: var(--w, 0%);
  border-radius: inherit;
  background: linear-gradient(90deg, color-mix(in srgb, var(--lever-color) 70%, #fff), var(--lever-color));
  transform-origin: left; animation: pbvBarGrow 6s var(--ease) infinite; }
.pbv-loop__tok { text-align: right;

.pbv-loop__note { margin-top: 6px; padding: 8px 12px; border-radius: 8px;

  border-left: 3px solid color-mix(in srgb, var(--lever-color) 60%, transparent); }

/* Lever 3 compounding-error section */
.pbv--decay { display: grid; gap: 10px; padding: 8px 0; position: relative; }
.pbv-decay__head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.pbv-decay__title { font: 700 .82rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .08em; color: var(--text); }
.pbv-decay__legend { display: inline-flex; align-items: center; gap: 6px;
  font: 700 .68rem/1 var(--font-mono, ui-monospace, monospace); color: var(--text-muted); }
.pbv-decay__sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 4px; }
.pbv-decay__sw--good { background: #34d399; }
.pbv-decay__sw--bad  { background: #f87171; }
.pbv-decay__chart { position: relative; height: 160px; padding: 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 80%, transparent); }
.pbv-decay__svg { width: 100%; height: 100%; display: block; transform: scaleY(-1); }
.pbv-decay__line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke;
  stroke-dasharray: 240; stroke-dashoffset: 240;
  animation: pbvDecayDraw 5s var(--ease) infinite; }
.pbv-decay__line--good { stroke: #34d399; }
.pbv-decay__line--bad  { stroke: #f87171; animation-delay: .4s; }
@keyframes pbvDecayDraw {
  0%, 6%    { stroke-dashoffset: 240; }

}
.pbv-decay__anno { position: absolute; font: 700 .7rem/1.1 var(--font-mono, ui-monospace, monospace);
  padding: 3px 7px; border-radius: 6px;
  opacity: 0; animation: pbvRowFade 5s var(--ease) infinite; }
.pbv-decay__anno--good { top: 10px; right: 12px; color: #34d399;
  background: color-mix(in srgb, #34d399 14%, transparent);
  border: 1px solid color-mix(in srgb, #34d399 40%, transparent); }
.pbv-decay__anno--bad  { bottom: 12px; right: 12px; color: #f87171;
  background: color-mix(in srgb, #f87171 14%, transparent);
  border: 1px solid color-mix(in srgb, #f87171 40%, transparent); animation-delay: .6s; }
.pbv-decay__axis-x { display: flex; justify-content: space-between;
  font: 700 .68rem/1 var(--font-mono, ui-monospace, monospace); color: var(--text-dim); }
.pbv-decay__chart { cursor: help; }
.pbv-decay__hover-hint {
  position: absolute; bottom: 7px; left: 10px;
  font: 600 .62rem/1 var(--font-mono, ui-monospace, monospace);

  transition: opacity .2s; }
.pbv--decay:hover .pbv-decay__hover-hint { opacity: 0; }
.pbv-decay__tooltip {
  position: absolute; inset: 0; z-index: 5;

  display: flex; flex-direction: column; gap: 8px; }

  opacity: 1; pointer-events: auto; }
.pbv-decay__tip-p {
  font-size: .73rem; line-height: 1.55;
  color: #cbd5e1; margin: 0; }
.pbv-decay__tip-p strong {
  color: #34d399; font-weight: 800; }

/* Lever 3 · collapsible section wrapper (click-to-reveal) */
.pb-extended-collapsible { margin: 6px 0 4px;

}

/* Lever 3 · applyTo + caching diagram */
.pbv--applyto-cache { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px;
  padding: 4px 0; }
.pbv-ac__col { position: relative; padding: 14px 16px 16px;
  background: color-mix(in srgb, var(--lever-color) 6%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--lever-color) 22%, var(--border));
  border-radius: var(--radius-sm); }
.pbv-ac__col::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: color-mix(in srgb, var(--lever-color) 75%, transparent);
  border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.pbv-ac__col-head { font: 800 .78rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .08em;
  color: color-mix(in srgb, var(--lever-color) 90%, var(--text));
  margin-bottom: 12px; }
.pbv-ac__code { margin: 0; padding: 12px 14px;
  background: color-mix(in srgb, var(--text) 92%, transparent);
  color: #e5e7eb;
  border-radius: 6px;
  font: 500 .78rem/1.55 var(--font-mono, ui-monospace, monospace);
  display: grid; gap: 2px;
  overflow-x: auto; }
.pbv-ac__code-line { opacity: 0; animation: pbvRowIn .8s var(--ease) forwards;
  white-space: pre; }
.pbv-ac__code-line.is-comment { color: #94a3b8; font-style: italic; }
.pbv-ac__code-line.is-divider { color: #64748b; }
.pbv-ac__code-line.is-key { color: color-mix(in srgb, var(--lever-color) 70%, #fbbf24); font-weight: 700; }
.pbv-ac__list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

@media (max-width: 720px) {
  .pbv--applyto-cache { grid-template-columns: 1fr; }
}

/* Lever 3 · context escalation ladder */
.pbv--context-ladder { display: grid; gap: 2px; padding: 4px 0;
  border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
  background: var(--surface); }
.pbv-cl__head { display: grid; grid-template-columns: 0.9fr 1.1fr 1.1fr;
  background: color-mix(in srgb, var(--lever-color) 85%, var(--text));
  color: #fff;
  font: 800 .74rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .08em; }
.pbv-cl__head-cell { padding: 10px 14px; }
.pbv-cl__row { display: grid; grid-template-columns: 0.9fr 1.1fr 1.1fr; gap: 0;
  opacity: 0; animation: pbvRowIn .5s var(--ease) forwards;
  border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
.pbv-cl__row:nth-child(odd) { background: color-mix(in srgb, var(--text-dim) 6%, transparent); }
.pbv-cl__cell { padding: 10px 14px; font-size: .85rem; line-height: 1.4; color: var(--text); }
.pbv-cl__cell--mention { font: 600 .82rem/1.4 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 85%, var(--text)); }
.pbv-cl__cell--avoid { font-weight: 700; }
.pbv-cl__cell--avoid-good { color: #16a34a; }

@media (max-width: 720px) {

  .pbv-cl__cell { padding: 6px 14px; }
  .pbv-cl__cell--mention { padding-top: 12px; font-size: .9rem; }
  .pbv-cl__cell--avoid { padding-bottom: 12px; }
}

/* Lever 3 · sessions as disposable */
.pbv--session-disposal { display: grid; gap: 2px; padding: 4px 0;
  border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
  background: var(--surface); }
.pbv-sd__intro { padding: 10px 14px;
  font: italic 500 .85rem/1.45 var(--font-mono, ui-monospace, monospace);
  color: var(--text-muted);
  background: color-mix(in srgb, var(--lever-color) 8%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--lever-color) 25%, var(--border)); }
.pbv-sd__head { display: grid; grid-template-columns: 0.8fr 1.3fr 0.9fr;
  background: color-mix(in srgb, var(--lever-color) 85%, var(--text));
  color: #fff;
  font: 800 .74rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .08em; }
.pbv-sd__head-cell { padding: 10px 14px; }
.pbv-sd__row { display: grid; grid-template-columns: 0.8fr 1.3fr 0.9fr; gap: 0;
  opacity: 0; animation: pbvRowIn .5s var(--ease) forwards;
  border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
.pbv-sd__row:nth-child(odd) { background: color-mix(in srgb, var(--text-dim) 6%, transparent); }
.pbv-sd__cell { padding: 10px 14px; font-size: .85rem; line-height: 1.4; color: var(--text); }
.pbv-sd__cell--action { font: 700 .82rem/1.4 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 85%, var(--text)); }
.pbv-sd__cell--impact { font-weight: 800; }
.pbv-sd__cell--impact-good { color: #16a34a; }
.pbv-sd__cell--impact-warn { color: #ea580c; }
@media (max-width: 720px) {
  .pbv-sd__head, .pbv-sd__row { grid-template-columns: 1fr; }
  .pbv-sd__head-cell:not(:first-child) { display: none; }
  .pbv-sd__cell { padding: 6px 14px; }
  .pbv-sd__cell--action { padding-top: 12px; font-size: .9rem; }
  .pbv-sd__cell--impact { padding-bottom: 12px; }
}

/* =========================================================================
   LEVER 4 · Output control
   ========================================================================= */
.pbv--output-tile { position: absolute; inset: 0; display: grid;
  grid-template-rows: auto 1fr auto; gap: 12px; padding: 14px 16px 16px; }
.pbv-out__rule { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--lever-color) 14%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--lever-color) 35%, var(--border)); }
.pbv-out__rule-mark { color: color-mix(in srgb, var(--lever-color) 95%, #fff); font-weight: 800; }
.pbv-out__rule-text { font: 700 .82rem/1.3 var(--font-mono, ui-monospace, monospace); color: var(--text); }
.pbv-out__lane { display: grid; grid-template-columns: 60px 1fr 90px; align-items: center; gap: 10px; }
.pbv-out__lane-label { font: 700 .7rem/1 var(--font-mono, ui-monospace, monospace);

.pbv-out__lane-track { display: block; height: 14px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 14%, transparent); overflow: hidden; }
.pbv-out__lane-fill { display: block; height: 100%; width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, color-mix(in srgb, var(--lever-color) 80%, #fff), var(--lever-color));
  transform-origin: left; animation: pbvOutShrink 5s var(--ease) infinite; }
@keyframes pbvOutShrink {
  0%, 12%   { transform: scaleX(1); }
  45%, 80%  { transform: scaleX(.28); }
  95%, 100% { transform: scaleX(1); }
}
.pbv-out__cost { text-align: right; font: 800 .78rem/1 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 90%, #fff); }
.pbv-out__save { display: flex; align-items: baseline; gap: 10px;
  padding: 8px 12px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--lever-color) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 35%, transparent); }
.pbv-out__save-num { font: 900 1.4rem/1 var(--font-mono, ui-monospace, monospace);
  color: color-mix(in srgb, var(--lever-color) 95%, #fff); letter-spacing: -.02em; }
.pbv-out__save-label { font-size: .78rem; color: var(--text-muted); }

/* Lever 4 hero */
.pbv--output-hero { position: relative; display: grid;
  grid-template-rows: auto 1fr 1fr 1fr auto; gap: 12px; min-height: 340px; }
.pbv-outh__title { display: flex; flex-direction: column; gap: 4px; }

  border: 1px solid color-mix(in srgb, var(--lever-color) 22%, var(--border));

.pbv-outh__lane-label { font: 700 .8rem/1.2 var(--font-mono, ui-monospace, monospace); color: var(--text); }
.pbv-outh__bar { display: block; height: 12px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 15%, transparent); overflow: hidden; }
.pbv-outh__bar-fill { display: block; height: 100%; width: var(--w, 0%);
  border-radius: inherit; transform-origin: left;
  animation: pbvBarGrow 5s var(--ease) infinite; }
.pbv-outh__bar-fill--loud { background: linear-gradient(90deg, #fde68a, #f59e0b); }
.pbv-outh__bar-fill--calm { background: linear-gradient(90deg,

.pbv-outh__lane-save { text-align: right; font: 800 .78rem/1 var(--font-mono, ui-monospace, monospace);

.pbv-outh__pulse { justify-self: end; display: inline-flex; align-items: center; gap: 8px;

.pbv-outh__pulse-num { font: 900 1rem/1 var(--font-mono, ui-monospace, monospace);

.pbv-outh__pulse-label { font: 700 .68rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); }

/* =========================================================================
   LEVER 5 · Choose the right mode
   ========================================================================= */
.pbv--mode-tile { position: absolute; inset: 0; display: grid;
  grid-template-rows: auto 1fr; gap: 10px; padding: 14px 16px 16px; }
.pbv-mode__title { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); }
.pbv-mode__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: stretch; }
.pbv-mode__card { display: grid; grid-template-rows: auto auto 1fr;
  gap: 6px; padding: 10px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 75%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 22%, var(--border));
  opacity: 0; animation: pbvRowFade 5.5s var(--ease) infinite; }
.pbv-mode__card--ask    { border-color: color-mix(in srgb, #34d399 50%, var(--border)); }
.pbv-mode__card--plan   { border-color: color-mix(in srgb, var(--lever-color) 55%, var(--border)); }
.pbv-mode__card--agent  { border-color: color-mix(in srgb, #f87171 55%, var(--border)); }
.pbv-mode__name { font-weight: 800; color: var(--text); font-size: .9rem; }
.pbv-mode__calls { font: 700 .7rem/1 var(--font-mono, ui-monospace, monospace); color: var(--text-muted); }
.pbv-mode__meter { display: block; height: 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 14%, transparent); overflow: hidden; align-self: end; }
.pbv-mode__meter-fill { display: block; height: 100%; width: var(--w, 0%);
  border-radius: inherit; transform-origin: left;
  background: linear-gradient(90deg, color-mix(in srgb, var(--lever-color) 70%, #fff), var(--lever-color));
  animation: pbvBarGrow 5.5s var(--ease) infinite; }
.pbv-mode__card--ask  .pbv-mode__meter-fill { background: linear-gradient(90deg, #6ee7b7, #34d399); }
.pbv-mode__card--agent .pbv-mode__meter-fill { background: linear-gradient(90deg, #fbbf24, #f87171); }

/* Lever 5 hero */
.pbv--mode-hero { position: relative; display: grid;
  grid-template-rows: auto 1fr 1fr 1fr auto; gap: 12px; min-height: 340px; }
.pbv-modeh__title { display: flex; flex-direction: column; gap: 4px; }
.pbv-modeh__eyebrow { font: 700 .72rem/1 var(--font-mono, ui-monospace, monospace);
  text-transform: uppercase; letter-spacing: .12em;
  color: color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-modeh__headline { font-size: 1.08rem; font-weight: 700; color: var(--text); }
.pbv-modeh__row { display: grid; grid-template-columns: 180px 1fr 180px;
  align-items: center; gap: 14px; padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--lever-color) 22%, var(--border));
  opacity: 0; animation: pbvHeroRowIn .6s var(--ease) forwards; }
.pbv-modeh__row--ask   { border-left: 4px solid #34d399; }
.pbv-modeh__row--plan  { border-left: 4px solid color-mix(in srgb, var(--lever-color) 80%, #fff); }
.pbv-modeh__row--agent { border-left: 4px solid #f87171; }
.pbv-modeh__head { display: flex; flex-direction: column; gap: 2px; }
.pbv-modeh__name { font-weight: 800; color: var(--text); font-size: 1rem; }
.pbv-modeh__use { font-size: .78rem; color: var(--text-muted); }
.pbv-modeh__meter { display: block; height: 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--text-dim) 15%, transparent); overflow: hidden; }
.pbv-modeh__meter-fill { display: block; height: 100%; width: var(--w, 0%);
  border-radius: inherit; transform-origin: left;
  background: linear-gradient(90deg, color-mix(in srgb, var(--lever-color) 70%, #fff), var(--lever-color));
  animation: pbvBarGrow 5s var(--ease) infinite; }
.pbv-modeh__row--ask   .pbv-modeh__meter-fill { background: linear-gradient(90deg, #6ee7b7, #34d399); }
.pbv-modeh__row--agent .pbv-modeh__meter-fill { background: linear-gradient(90deg, #fbbf24, #f87171); }

  color: color-mix(in srgb, var(--lever-color) 90%, #fff); }
